<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZAG Structures Slovenia</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --blue:#0A7CFF; --blue2:#3D9BFF; --green:#30B25A; --orange:#F09000; --red:#E0453A;
  --purple:#7A45C7; --teal:#1C8FA3;
  --gray:#7C7F86; --gray3:#C9CBD1; --gray4:#DCDEE3; --gray5:#EAECF0; --gray6:#F4F5F7;

  --bg:#F2F2F7; --card:#FFFFFF; --panel:#F2F2F7;
  --sep:rgba(60,60,67,.13); --sep2:rgba(60,60,67,.22);
  --label:#1C1C1E; --label2:#6E6E73; --label3:#A1A1A6;
  --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.20);
  --mat:rgba(255,255,255,.80); --mat-b:rgba(255,255,255,.55);
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.09);
  --shadow-s:0 1px 2px rgba(0,0,0,.05),0 3px 10px rgba(0,0,0,.07);

  --d-bridge:#1273D4; --d-ai:#7B4BD8; --d-build:#C77A0E; --d-mat:#1E9A57;
  --d-fire:#D9453A; --d-geo:#96602A; --d-energy:#0E93A6; --d-herit:#C0398C;
  --d-inst:#60687A; --d-tunnel:#5A4FCF; --d-cable:#0E8F8F; --d-quake:#B8532A;

  --m-neigh:#CBCFD6; --m-land:#F8F6EC;
  --m-out:#E4E6EA; --m-mun:rgba(30,26,18,.08);
  --m-reg:rgba(30,26,18,.18); --m-coast:rgba(30,26,18,.42);
  --m-bord:rgba(46,50,58,.36);
  --m-riv:#A6D6F1; --m-mot:#FFD87B; --m-mot-c:#E0AF4E; --m-rail:#BCB7AC;
  --m-grat:rgba(255,255,255,.55); --m-hl:rgba(10,124,255,.12);
  --m-lab:#3B3B40; --m-lab2:#6E6E76; --m-si:#0A7CFF;
  --m-shade:#5A616B;

  --r:16px; --r-l:16px; --r-xl:22px; --r-p:100px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --panelw:500px;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --blue:#4DA3FF; --blue2:#7CBEFF; --green:#41C97A; --orange:#FFAE3D; --red:#FF6B5E;
  --purple:#B889FF; --teal:#4FC4D8;
  --bg:#0D0F12; --card:#1A1D22; --panel:#0D0F12;
  --sep:rgba(255,255,255,.11); --sep2:rgba(255,255,255,.20);
  --label:#F2F4F7; --label2:#A2A8B3; --label3:#787F8B;
  --fill:rgba(255,255,255,.09); --fill2:rgba(255,255,255,.16);
  --mat:rgba(26,29,34,.82); --mat-b:rgba(255,255,255,.10);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 36px rgba(0,0,0,.55);
  --shadow-s:0 1px 3px rgba(0,0,0,.5);
  --d-bridge:#57AEFF; --d-ai:#BC9BFF; --d-build:#F0B357; --d-mat:#45CC85;
  --d-fire:#FF7A6E; --d-geo:#D79C5C; --d-energy:#48C9DC; --d-herit:#F27BC4;
  --d-inst:#9BA3B4; --d-tunnel:#9A90FF; --d-cable:#4FD0D0; --d-quake:#F0946A;
  --m-neigh:#24272D; --m-land:#33363E;
  --m-out:#0E1013; --m-mun:rgba(255,255,255,.08);
  --m-reg:rgba(255,255,255,.20); --m-coast:rgba(255,255,255,.40);
  --m-bord:rgba(255,255,255,.18);
  --m-riv:#2D5872; --m-mot:#7A6432; --m-mot-c:#9C8145; --m-rail:#5C5F66;
  --m-grat:rgba(255,255,255,.07); --m-hl:rgba(87,174,255,.16);
  --m-lab:#E8E8EC; --m-lab2:#9A9AA3; --m-si:#4DA3FF; --m-shade:#000;
}}
:root[data-theme="dark"]{
  --blue:#4DA3FF; --blue2:#7CBEFF; --green:#41C97A; --orange:#FFAE3D; --red:#FF6B5E;
  --purple:#B889FF; --teal:#4FC4D8;
  --bg:#0D0F12; --card:#1A1D22; --panel:#0D0F12;
  --sep:rgba(255,255,255,.11); --sep2:rgba(255,255,255,.20);
  --label:#F2F4F7; --label2:#A2A8B3; --label3:#787F8B;
  --fill:rgba(255,255,255,.09); --fill2:rgba(255,255,255,.16);
  --mat:rgba(26,29,34,.82); --mat-b:rgba(255,255,255,.10);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 36px rgba(0,0,0,.55);
  --shadow-s:0 1px 3px rgba(0,0,0,.5);
  --d-bridge:#57AEFF; --d-ai:#BC9BFF; --d-build:#F0B357; --d-mat:#45CC85;
  --d-fire:#FF7A6E; --d-geo:#D79C5C; --d-energy:#48C9DC; --d-herit:#F27BC4;
  --d-inst:#9BA3B4; --d-tunnel:#9A90FF; --d-cable:#4FD0D0; --d-quake:#F0946A;
  --m-neigh:#24272D; --m-land:#33363E;
  --m-out:#0E1013; --m-mun:rgba(255,255,255,.08);
  --m-reg:rgba(255,255,255,.20); --m-coast:rgba(255,255,255,.40);
  --m-bord:rgba(255,255,255,.18);
  --m-riv:#2D5872; --m-mot:#7A6432; --m-mot-c:#9C8145; --m-rail:#5C5F66;
  --m-grat:rgba(255,255,255,.07); --m-hl:rgba(87,174,255,.16);
  --m-lab:#E8E8EC; --m-lab2:#9A9AA3; --m-si:#4DA3FF; --m-shade:#000;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--label);
  font:400 17px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  letter-spacing:-.011em;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;margin:0;padding:0}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
:focus{outline:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px;border-radius:8px}
svg :focus,svg :focus-visible{outline:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-90px;z-index:999;background:var(--card);color:var(--label);
  padding:11px 15px;border-radius:var(--r);box-shadow:var(--shadow);transition:top .18s}
.skip:focus{top:12px}

#app{position:relative;width:100%;height:100vh;height:100dvh;min-height:540px;overflow:hidden;
  display:grid;grid-template-columns:minmax(0,1fr) var(--panelw);grid-template-rows:minmax(0,1fr);
  background:var(--bg)}
.mapwrap{position:relative;overflow:hidden;min-width:0;min-height:0;
  background:linear-gradient(168deg,#F3F4F7,#EAECF0 46%,#E1E4E9)}
:root[data-theme="dark"] .mapwrap{background:linear-gradient(168deg,#16191E,#12151A 46%,#0E1116)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mapwrap{
  background:linear-gradient(168deg,#16191E,#12151A 46%,#0E1116)}}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}

.toast{position:absolute;left:50%;bottom:18px;transform:translate(-50%,18px);z-index:60;
  background:var(--label);color:var(--bg);border-radius:var(--r-p);padding:10px 18px;font-size:14px;
  font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;max-width:80%}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1300px){ :root{--panelw:440px} }
@media (max-width:1120px){ :root{--panelw:390px} h1.lt{font-size:28px} body{font-size:16px} }
@media (max-width:820px){
  #app{display:block}
  .mapwrap{position:absolute;inset:0}
  .hud{padding:calc(12px + var(--safe-t)) 12px 0}
  .titlecard{max-width:calc(100% - 46px)}
  .chipbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:3px;max-width:100%}
  .chipbar::-webkit-scrollbar{display:none}
  .chip,.search,.iconbtn{height:34px}
  .search{min-width:150px}
  .mapfoot{left:12px;right:12px;bottom:auto;top:calc(116px + var(--safe-t));align-items:flex-start}
  .footl{align-items:flex-start}
  .maplegend{display:none}
  .tip{display:none}
  .sheet{position:absolute;left:0;right:0;bottom:0;top:auto;
    height:calc(100% - 112px - var(--safe-t));
    border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.18);
    will-change:transform}
  .sheet.anim{transition:transform .38s cubic-bezier(.32,.72,0,1)}
  .grab{display:flex;height:22px;flex:0 0 auto;align-items:center;justify-content:center;
    cursor:grab;touch-action:none}
  .grab i{width:38px;height:5px;border-radius:3px;background:var(--gray3)}
  .tabs{margin:2px 14px 2px;touch-action:none}
  .tabs button{font-size:13.5px;padding:10px 2px}
  .shead{padding:10px 15px 0;touch-action:none}
  .sbody{padding:6px 15px calc(48px + var(--safe-b))}
  .toast{bottom:auto;top:calc(16px + var(--safe-t))}
}
</style>
</head>
<body>
<a href="#sbody" class="skip">Skip to main content</a>
<div id="app">
  <div class="mapwrap">
    <div id="map"></div>
    <div class="hud">
      <div class="titlecard frost">
        <b>ZAG Structures Slovenia</b>
        <s>Slovenian National Building and Civil Engineering Institute</s>
      </div>
    </div>
  </div>
  
  <div class="sheet">
    <div class="grab"><i></i></div>
    <div class="tabs">
      <button aria-selected="true">Map Overview</button>
      <button aria-selected="false">Projects List</button>
    </div>
    <div id="sbody" class="sbody">
      <h1 class="lt">Slovenian Sites</h1>
      <p class="sub">Interactive map of active research and infrastructure projects.</p>
    </div>
  </div>
</div>

<script>
  // Universal relative folder path declaration
  // Relative to index.html location regardless of repo name
  const DATA_PATH = './Slovenia/';

  // Universal Data Loader
  async function loadMapData(filename) {
    try {
      const response = await fetch(`${DATA_PATH}${filename}`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    } catch (err) {
      console.error(`Error loading ${filename} from ${DATA_PATH}:`, err);
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    // Automatically attempts to load assets relatively
    loadMapData('data.json');
  });
</script>
</body>
</html>
