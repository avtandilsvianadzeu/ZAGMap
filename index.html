<style>

  --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.20);

  --shadow-s:0 1px 2px rgba(0,0,0,.05),0 3px 10px rgba(0,0,0,.07);

  --d-bridge:#1273D4; --d-ai:#7B4BD8; --d-build:#C77A0E; --d-mat:#1E9A57;

  --d-inst:#60687A; --d-tunnel:#5A4FCF; --d-cable:#0E8F8F; --d-quake:#B8532A;

  --m-neigh:#CBCFD6; --m-land:#F8F6EC;
  --m-out:#E4E6EA; --m-mun:rgba(30,26,18,.08);
  --m-reg:rgba(30,26,18,.18); --m-coast:rgba(30,26,18,.42);
  --m-bord:rgba(46,50,58,.36);
  --m-riv:#A6D6F1; --m-mot:#FFD87B; --m-mot-c:#E0AF4E; --m-rail:#BCB7AC;
  --m-grat:rgba(255,255,255,.55); --m-hl:rgba(10,124,255,.12);
  --m-lab:#3B3B40; --m-lab2:#6E6E76; --m-si:#0A7CFF;
  --m-shade:#5A616B;

  --r:16px; --r-l:16px; --r-xl:22px; --r-p:100px;

}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--label);
  font:400 17px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  letter-spacing:-.011em;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;margin:0;padding:0}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
:focus{outline:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px;border-radius:8px}
svg :focus,svg :focus-visible{outline:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-90px;z-index:999;background:var(--card);color:var(--label);
  padding:11px 15px;border-radius:var(--r);box-shadow:var(--shadow);transition:top .18s}
.skip:focus{top:12px}

#app{position:relative;width:100%;height:100vh;height:100dvh;min-height:540px;overflow:hidden;
  display:grid;grid-template-columns:minmax(0,1fr) var(--panelw);grid-template-rows:minmax(0,1fr);
  background:var(--bg)}
.mapwrap{position:relative;overflow:hidden;min-width:0;min-height:0;
  background:linear-gradient(168deg,#F3F4F7,#EAECF0 46%,#E1E4E9)}
:root[data-theme="dark"] .mapwrap{background:linear-gradient(168deg,#16191E,#12151A 46%,#0E1116)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mapwrap{
  background:linear-gradient(168deg,#16191E,#12151A 46%,#0E1116)}}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}

#l-sh2{fill:var(--m-shade);opacity:.055;pointer-events:none}
#l-sh1{fill:var(--m-shade);opacity:.10;pointer-events:none}
#l-eu{fill:var(--m-neigh);stroke:var(--m-bord);stroke-width:.85;
  vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
#l-bord{fill:none;stroke:var(--m-bord);stroke-width:.85;stroke-opacity:.72;
  vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;
  pointer-events:none}
#l-halo{fill:none;stroke:var(--m-si);stroke-width:9;stroke-opacity:.22;
  vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
#l-halo.off{display:none}
.cbadge{pointer-events:none}
.cbadge circle{fill:var(--m-si);stroke:#fff;stroke-width:2.5;
  vector-effect:non-scaling-stroke;filter:url(#mkshadow)}
.cbadge text{fill:#fff;font:700 13px/1 -apple-system,system-ui,sans-serif;text-anchor:middle}
.cbadge .cap{fill:var(--m-lab);font:650 12px/1 -apple-system,system-ui,sans-serif;
  paint-order:stroke;stroke:var(--m-out);stroke-width:3;stroke-linejoin:round}
#l-lsh2{fill:var(--m-shade);opacity:.09;pointer-events:none}
#l-lsh1{fill:var(--m-shade);opacity:.13;pointer-events:none}
#l-land{fill:var(--m-land);stroke:var(--m-si);stroke-width:2.2;
  vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
.pl{pointer-events:none}
.pl circle{fill:var(--m-lab2);opacity:.55}
.pl text{fill:var(--m-lab);paint-order:stroke;stroke:var(--m-land);stroke-width:2.8;
  stroke-linejoin:round;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.pl.t1 text{font-size:12.5px;font-weight:650;letter-spacing:-.1px}
.pl.t1 circle{r:2.8;fill:var(--m-lab)}
.pl.t2 text{font-size:10.8px;font-weight:560;fill:var(--m-lab)}
.pl.t3 text{font-size:10px;font-weight:500;fill:var(--m-lab2)}
.pl.t4 text{font-size:9.2px;font-weight:400;fill:var(--m-lab2)}
.pl.t4 circle{r:1.5}
.pl.fo text{font-style:italic;fill:var(--m-lab2)}
.pl.fo circle{fill:var(--m-lab2)}
.pl.hide{display:none}
.peak{pointer-events:none}
.peak.hide{display:none}
.peak .tri{fill:none;stroke:var(--m-lab);stroke-width:1.4;stroke-linejoin:round;opacity:.75}
.peak text{font:600 10px/1 -apple-system,system-ui,sans-serif;fill:var(--m-lab);opacity:.85;
  paint-order:stroke;stroke:var(--m-land);stroke-width:2.6;stroke-linejoin:round}
#l-coast{fill:none;stroke:var(--m-coast);stroke-width:1;vector-effect:non-scaling-stroke;
  stroke-linejoin:round;pointer-events:none}
#l-mun{fill:none;stroke:var(--m-mun);stroke-width:.7;vector-effect:non-scaling-stroke;pointer-events:none}
#l-grat path{fill:none;stroke:var(--m-grat);stroke-width:.7;vector-effect:non-scaling-stroke}
.regfill{fill:transparent;stroke:var(--m-reg);stroke-width:.9;vector-effect:non-scaling-stroke;
  cursor:pointer;transition:fill-opacity .2s}
.regfill.shade{fill:var(--blue)}
.regfill.on{fill:var(--blue);fill-opacity:.2!important;stroke:var(--blue);stroke-width:2.2}
.riv{fill:none;stroke:var(--m-riv);stroke-width:2.8;vector-effect:non-scaling-stroke;
  stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.rivhit{fill:none;stroke:transparent;stroke-width:16;vector-effect:non-scaling-stroke;cursor:pointer}
#l-mot2{fill:none;stroke:var(--m-mot-c);stroke-width:5;vector-effect:non-scaling-stroke;
  stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#l-mot{fill:none;stroke:var(--m-mot);stroke-width:3.4;vector-effect:non-scaling-stroke;
  stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.rail{fill:none;stroke:var(--m-rail);stroke-width:1;stroke-dasharray:6 5;
  vector-effect:non-scaling-stroke;pointer-events:none}
.off{display:none}

.mk{cursor:pointer}
.mk .hit{fill:transparent;stroke:none}
.mk .pulse{fill:none}
.mk .ring{fill:#fff;stroke:none;filter:url(#mkshadow)}
.mk .core{fill:var(--dc)}
.mk .glyph{fill:none;stroke:#fff;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;
  pointer-events:none}
.mk .glyph.f{fill:#fff;stroke:none}
.mk .inner{fill:none;stroke:none}
.mk .approx{fill:none;stroke:none}
.mk[data-p="approx"] .approx{stroke:var(--dc);stroke-width:1.3;stroke-dasharray:2.6 2.6;opacity:.85;
  vector-effect:non-scaling-stroke}
.mk[data-d="bridge"]{--dc:var(--d-bridge)} .mk[data-d="ai"]{--dc:var(--d-ai)}
.mk[data-d="energy"]{--dc:var(--d-energy)} .mk[data-d="geo"]{--dc:var(--d-geo)}
.mk[data-d="fire"]{--dc:var(--d-fire)} .mk[data-d="mat"]{--dc:var(--d-mat)}
.mk[data-d="inst"]{--dc:var(--d-inst)} .mk[data-d="build"]{--dc:var(--d-build)}
.mk[data-d="herit"]{--dc:var(--d-herit)}
.mk[data-d="tunnel"]{--dc:var(--d-tunnel)} .mk[data-d="cable"]{--dc:var(--d-cable)}
.mk[data-d="quake"]{--dc:var(--d-quake)}
.mk[data-c="inst"] .inner{stroke:#fff;stroke-width:1.6;vector-effect:non-scaling-stroke}
.mk[data-c="ctx"] .core{fill:#fff;stroke:var(--dc);stroke-width:2.6}
.mk[data-c="ctx"] .glyph{stroke:var(--dc)}
.mk[data-c="ctx"] .glyph.f{fill:var(--dc)}
.mk .lab{font:600 11.5px/1 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;fill:var(--m-lab);
  paint-order:stroke;stroke:var(--m-land);stroke-width:3.4;stroke-linejoin:round;
  opacity:0;transform:translateX(-5px);pointer-events:none;letter-spacing:-.1px;
  transition:opacity .2s ease,transform .26s cubic-bezier(.2,.9,.3,1.25)}
.mk.named .lab,.mk:hover .lab,.mk.sel .lab{opacity:1;transform:translateX(0)}
.mk.sel .lab{font-weight:700}
.mk.hide{display:none}
.mk.dim{opacity:.22}
.mk .fring{fill:none;stroke:none}
.mk:focus-visible .fring{stroke:var(--blue);stroke-width:2.5;vector-effect:non-scaling-stroke}
.mk.small:focus-visible .fring{r:11}
.regfill:focus-visible,.rivhit:focus-visible{stroke:var(--blue);stroke-width:2.5;
  vector-effect:non-scaling-stroke}
.mk.sel .ring{stroke:var(--dc);stroke-width:2.8}
.mk.sel .pulse{fill:var(--dc);opacity:.16;animation:pl 2.2s ease-out infinite}
@keyframes pl{0%{r:12;opacity:.3}100%{r:36;opacity:0}}
.mk .dot{fill:var(--dc);stroke:#fff;stroke-width:1.6;vector-effect:non-scaling-stroke;
  filter:url(#mkshadow)}
.mk[data-c="ctx"] .dot{fill:#fff;stroke:var(--dc);stroke-width:2}
.mk.small .ring,.mk.small .core,.mk.small .inner,.mk.small .glyph,.mk.small .approx{display:none}
.mk:not(.small) .dot{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.frost{background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(22px);
  backdrop-filter:saturate(180%) blur(22px);border:1px solid var(--mat-b)}
.hud{position:absolute;left:0;right:0;top:0;z-index:26;padding:13px 14px 0;pointer-events:none}
.hud>*{pointer-events:auto}
.titlecard{display:inline-block;max-width:min(100%,420px);border-radius:13px;padding:8px 14px;
  box-shadow:var(--shadow-s)}
.titlecard b{display:block;font-size:14px;font-weight:650;letter-spacing:-.02em}
.titlecard s{display:block;text-decoration:none;font-size:12px;color:var(--label2);margin-top:1px}

.chipbar{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  max-width:min(100%,820px)}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;
  border-radius:var(--r-p);background:rgba(255,255,255,.90);
  -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  box-shadow:var(--shadow-s);font-size:13px;font-weight:600;color:var(--label);white-space:nowrap;
  transition:transform .12s,background .18s,color .18s}
:root[data-theme="dark"] .chip:not([aria-pressed="true"]){background:rgba(26,29,34,.88)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip:not([aria-pressed="true"]){background:rgba(26,29,34,.88)}}
.chip:active{transform:scale(.96)}
.chip i{width:9px;height:9px;border-radius:5px;flex:0 0 auto;box-sizing:border-box}
.chip u{text-decoration:none;color:var(--label3);font-variant-numeric:tabular-nums;
  font-weight:600;font-size:12px}
.chip[aria-pressed="true"]{color:#fff;background:linear-gradient(180deg,var(--blue2),var(--blue));
  box-shadow:0 1px 2px rgba(0,60,140,.22)}
.chip[aria-pressed="true"] u{color:rgba(255,255,255,.72)}
.chip[aria-pressed="true"] i{box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}

.search{position:relative;flex:0 0 auto;display:flex;align-items:center;height:32px;
  border-radius:var(--r-p);background:rgba(255,255,255,.92);
  -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  box-shadow:var(--shadow-s);padding:0 10px 0 29px;min-width:164px}
:root[data-theme="dark"] .search{background:rgba(26,29,34,.90)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .search{background:rgba(26,29,34,.90)}}
.search>svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:12px;height:12px;
  fill:var(--label3);pointer-events:none}
.search input{flex:1;height:100%;border:0;background:none;font-size:13px;min-width:0;padding:0;outline:none}
.search input::placeholder{color:var(--label3)}
.search input::-webkit-search-cancel-button{display:none}
.search .clr{width:22px;height:22px;margin-right:-4px;display:none;align-items:center;
  justify-content:center;position:relative;flex:0 0 auto}
.search .clr::before{content:"";position:absolute;width:17px;height:17px;border-radius:9px;background:var(--gray3)}
.search .clr svg{position:relative;width:8px;height:8px;color:var(--card)}
.search.has .clr{display:flex}

.iconbtn{width:32px;height:32px;flex:0 0 auto;border-radius:var(--r-p);
  background:rgba(255,255,255,.90);
  -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  box-shadow:var(--shadow-s);display:flex;align-items:center;justify-content:center;color:var(--blue)}
:root[data-theme="dark"] .iconbtn{background:rgba(26,29,34,.88)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .iconbtn{background:rgba(26,29,34,.88)}}
.iconbtn:active{transform:scale(.96)}
.iconbtn svg{width:16px;height:16px}

.mapfoot{position:absolute;left:16px;right:16px;bottom:16px;z-index:25;display:flex;
  align-items:flex-end;justify-content:space-between;gap:12px;pointer-events:none}
.mapfoot>*{pointer-events:auto}
.footl{display:flex;flex-direction:column;gap:9px;align-items:flex-start;min-width:0}
.maplegend{display:flex;flex-direction:column;gap:4px;padding:9px 11px;border-radius:13px;
  box-shadow:var(--shadow-s);font-size:11.5px;font-weight:500;line-height:1.35;
  pointer-events:none;max-width:214px}
.maplegend strong{font-size:11.5px;font-weight:650;letter-spacing:-.01em;color:var(--label)}
.maplegend i{display:flex;align-items:center;gap:7px;color:var(--label2);font-style:normal;line-height:1.3}
.maplegend b{width:10px;height:10px;border-radius:5px;flex:0 0 auto;box-sizing:border-box}
.maplegend b2{font-variant-numeric:tabular-nums;font-weight:650;color:var(--label3);font-size:11px}
.maplegend .ramp{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:1px 0 2px}
.maplegend .ramp span{flex:1}

5L435.49 594.68L434.82 594.43L434.69 594.08L434.49 593.77L433.74 593.47L433.52 593.29L433.25 593.21L432.36 592.00L432.45 591.75L432.44 591.53L430.76 590.88L430.32 590.77L429.94 590.58L429.05 590.42L428.64 590.25L428.18 590.28L427.69 590.09L426.88 590.09L426.39 590.03M440.84 598.56L441.32 598.19L441.66 598.08L442.26 598.04L442.70 597.86L443.15 597.81L443.85 598.38L444.23 598.29L444.66 598.00L445.52 597.66L446.29 597.10L446.67 596.93L447.48 596.85L447.96 596.99L448.53 597.27L449.07 597.66L450.14 598.64L450.43 598.75L450.91 598.63L451.20 598.62L452.28 598.97L453.40 599.04L453.75 599.19L454.03 599.49L454.22 600.03L454.33 600.19L454.51 600.32L455.25 600.62L455.82 600.62L456.06 600.66L456.45 600.93L457.59 602.05L458.41 602.32","km":194}],"aff":{"minx":2498222.317,"maxy":5524871.815,"k":0.00020207096377651795},"entries":[{"id":"tomacevo","n":"Tomačevo Bridge","sl":"Most čez Savo v Tomačevem","cls":"doc","cat":"bridge","lat":46.0856,"lon":14.53642,"prec":"derived","loc":"Ljubljana","crosses":"Sava","carries":"H3 northern ring road","built":1982,"len_m":null,"spans":7,"typ":"Seven-span continuous post-tensioned double-T deck, cast in place with sliding formwork, on circular piers with deep foundations","role":"Bridge weigh-in-motion and structural health monitoring","detail":"Elastomeric bearings at the piers and guided unidirectional pot bearings at the abutments. ZAG, Cestel and Dewesoft Monitoring instrumented the bridge for combined bridge weigh-in-motion and structural health monitoring. A controlled load test in May 2024 ran two pre-weighed calibration trucks over 72 passages across two nights, recording strain, acceleration, temperature and displacement at 500 Hz. During normal operation in March 2023 the system captured a 13-axle vehicle weighing over 200 tonnes.","people":["Doron Hekič (ZAG / UL FGG)","Jan Kalin (ZAG)","Aleš Žnidarič (ZAG / UL FGG)","Andrej Anžlin (ZAG)","Peter Češarek (UL FGG)"],"partners":["Cestel d.o.o.","Dewesoft Monitoring d.o.o.","UL FGG"],"years":"2023-2025","src":["appsci2025","dewesoft","cestel","zagbridges"],"p":[439.27,598.46],"tm":[464148.6,105194.5],"reg":"SI041","dom":"ai","doms":["ai","bridge"],"hist":"The bridge carries road number 104 over the Sava north of Ljubljana and is one of the most used routes between the city and its northern suburbs. It is a seven span continuous post tensioned concrete structure of 204 m built in 1982, in two parallel independent decks carrying opposite directions of traffic. The instrumentation combines a Cestel SiWIM MkIV bridge weigh in motion system with fourteen triaxial MEMS accelerometers, two strain transducers at main girder mid spans, temperature sensors, displacement transducers and a laser deflection meter, sampling at 500 Hz during controlled testing. The site runs on a 600 Ah battery bank with 600 W of solar.","facts":[["Structure","seven span continuous post tensioned concrete, 204 m, built 1982"],["Road carried","road number 104 over the Sava"],["B-WIM system","Cestel SiWIM MkIV"],["Accelerometers","14 triaxial MEMS"],["Sampling","500 Hz, node synchronisation about one microsecond"],["Power","600 Ah battery bank, 600 W solar"],["Heaviest recorded vehicle","a 13 axle truck over 200 tonnes, about 3.6 mm deflection"]],"zagn":"Documented. ZAG is named as one of three collaborating organisations on this installation, with Cestel d.o.o. and Dewesoft Monitoring d.o.o., handling structural evaluation and validation. Note that the Cestel account of the same bridge names only Cestel, Dewesoft and Essebi."},{"id":"ravbarkomanda","n":"Ravbarkomanda Viaduct","sl":"Viadukt Ravbarkomanda","cls":"doc","cat":"bridge","lat":45.821,"lon":14.24,"prec":"approximate","loc":"A1 between Planina and Postojna","crosses":"A double-track railway and a state road, crossed twice","carries":"A1 motorway (Ljubljana-Koper)","built":1972,"len_m":588,"spans":15,"typ":"Twin precast prestressed I-girder viaducts on elastomeric bearings, each divided into four units by expansion joints","role":"Long-term structural health monitoring and bridge weigh-in-motion","detail":"Two parallel structures carrying one direction each, built in 1972 on what is now the Venice to Lviv corridor. ZAG instrumented span P14D of the right-hand viaduct with strain gauges on the bottom flange of four main girders at mid-span, and triaxial accelerometers across several spans for ambient and traffic-induced modal testing. A bridge weigh-in-motion system supplies the traffic loading, and the measured response is used to update a finite element model of the structure. Both viaducts were fully rehabilitated between May 2017 and July 2019, including carbon fibre strengthening of the cantilevers, bearing replacement and a one metre deck widening.","people":["Doron Hekič (ZAG)","Andrej Anžlin (ZAG)","Aleš Žnidarič (ZAG)","Peter Češarek (UL FGG)","Diogo Ribeiro (Polytechnic of Porto)"],"partners":["DARS","UL FGG","Polytechnic of Porto"],"years":"2023-2024","src":["sensors2023","sensors2024","kolektor","stareslike","mapcarta_rk"],"note":"Dimensions differ between the two papers. Sensors 23(4) gives 588 m with 15 spans for the left structure and 544 m with 17 spans for the right; Sensors 24(9) gives 560 m and 16 spans. The figures shown are from the earlier and more detailed description. The coordinate is taken from the A1 alignment between Planina and Postojna, not from a survey point.","tm":[440944.3,75963.4],"p":[434.96,604.67],"reg":"SI038","dom":"ai","doms":["ai","bridge"],"opened":"1972","rebuilt":"Rehabilitated between May 2017 and July 2019, including carbon fibre strengthening of the cantilevers, bearing replacement and a one metre deck widening. The permanent monitoring system was installed during that work.","hist":"Ravbarkomanda is a twin multi span precast I girder viaduct on the fifth Trans European corridor, which runs from Venice to Lviv. The two parallel structures are 588 m and 544 m long, with fifteen spans on the left viaduct and seventeen on the right, and each carries two lanes and a hard shoulder. The monitoring system installed during the rehabilitation comprises 216 sensors measuring longitudinal strain on main girders, pier caps and deck extensions, temperature sensors across several spans, accelerometers on external prestressing tendons at 24 locations across both viaducts, 40 fibre Bragg grating sensors on carbon fibre rods, and long gauge deformation sensors at six pier cap locations per viaduct. Strain gauges record at 500 samples per second with a 35 Hz low pass filter. The structure crosses a double track railway line and a state road twice.","facts":[["Lengths","588 m left viaduct, 544 m right viaduct"],["Spans","15 left, 17 right"],["Built","1972, rehabilitated 2017 to 2019"],["Sensors","216 strain, 40 fibre Bragg grating, accelerometers at 24 tendon locations"],["Strain sampling","500 samples per second, 35 Hz low pass filter"],["Model updating case study","span P14D, using 11 to 12 strain sensors"]],"zagn":"Documented. The Sensors 2023 paper on model updating from bridge weigh in motion data uses this viaduct as its case study. Andrej Anzlin, Maja Kreslin and Ales Znidaric are affiliated to the ZAG Department of Structures, and Doron Hekic holds a joint affiliation with ZAG and UL FGG."},{"id":"vransko","n":"Vransko Bridge","sl":"Most pri Vranskem","cls":"doc","cat":"road","lat":46.25111,"lon":14.94472,"prec":"locality","loc":"Vransko","crosses":"Motorway crossing in the Savinja valley","carries":"A1 motorway","built":null,"len_m":26,"span_m":24.8,"spans":1,"typ":"Simply supported beam and slab deck, 12 m wide, no skew","role":"Bridge weigh-in-motion measurement and direct measurement of dynamic amplification","detail":"One of the earliest long SiWIM deployments. Strain was recorded continuously for 58 days, from 25 September to 21 November 2006, capturing 147,524 vehicles including roughly 74,000 five-axle articulated trucks. Total and static bending moments at mid-span were separated to measure the dynamic amplification directly from traffic rather than inferring it from a code factor. The work was done with University College Dublin.","people":["Aleš Žnidarič (ZAG)","Eugene J. OBrien (UCD)","Arturo González (UCD)","Jason Dowling (UCD)"],"partners":["University College Dublin","Cestel d.o.o."],"years":"2006-2009","src":["ucd2009","cestel","zagbridges"],"note":"The coordinate is the settlement of Vransko, not the bridge deck.","tm":[495737.7,123486.8],"p":[445.4,594.35],"reg":"SI034","dom":"ai","doms":["ai","bridge"],"hist":"The bridge near Vransko is a simply supported beam and slab structure with a span of 24.8 m between supports, a total length of 26 m, a width of 12 m and no skew. It has been used as a bridge weigh in motion test site with a SiWIM system in the nothing on the road configuration, using ten strain sensors, two per beam, with additional upstream and downstream gauges for axle detection. In the study by OBrien, Gonzalez, Dowling and Znidaric the system ran for 58 days from 25 September to 21 November 2006 and recorded 147,524 vehicles, of which about 74,000 were five axle articulated trucks. The work sits within the European ARCHES project and used the measurements to extract bridge dynamic amplification directly from traffic rather than from controlled runs. The paper states that exact static weights were not available, so no weighing accuracy figure is reported for this deployment.","facts":[["Span","24.8 m between supports, 26 m total"],["Width","12 m, no skew"],["Campaign","58 days, 25 September to 21 November 2006"],["Vehicles recorded","147,524, about 74,000 five axle articulated"],["Sensors","ten strain sensors, two per beam, plus axle detection"],["Configuration","nothing on the road SiWIM"]],"zagn":"Documented. The paper states that the SiWIM system was developed by the Slovenian National Building and Civil Engineering Institute, ZAG, and manufactured by Cestel, and Ales Znidaric of ZAG is an author."},{"id":"nm_brv","n":"Novo Mesto Stress Ribbon Footbridge","sl":"Brv čez Krko, Novo mesto","cls":"doc","cat":"foot","lat":45.801095,"lon":15.152007,"prec":"surveyed","loc":"Novo mesto","crosses":"Krka","carries":"Footway and cycleway","built":2023,"len_m":null,"span_m":120.5,"spans":1,"typ":"Stress ribbon deck of 46 precast concrete panels carried on six tendons in grouted HDPE ducts, 4 m wide","role":"Static and dynamic load testing, and validation of the finite element model","detail":"The first bridge in Slovenia built with stress ribbon technology. ZAG carried out the load test in March 2023: static loading in three stages, dynamic testing with a light truck driven over artificial obstacles, and ambient vibration measurement. Vertical displacements, natural frequencies and mode shapes were compared against a finite element model and agreed well. The reported deflection was 130 mm under a 70 tonne load. Client was the City Municipality of Novo mesto, built by CGP Novo mesto with Freyssinet Adria, designed by Ponting Bridges and Pipenbaher Consulting Engineers.","people":["Đorđe Đukić (ZAG)","Doron Hekič (ZAG)","Mirko Kosič (ZAG)","Andrej Anžlin (ZAG)","Rok Vezočnik (UM FGPA)","Andrej Štrukelj (UM FGPA)","Marjan Pipenbaher","Tomaž Weingerl"],"partners":["Mestna občina Novo mesto","CGP Novo mesto","Freyssinet Adria","Ponting Bridges","Pipenbaher Consulting Engineers","UM FGPA"],"years":"2023","src":["iabmas2024","freyssinet","pont_nm","zagbridges"],"note":"Coordinate is on the bridge deck, from a published waypoint for the footbridge.","tm":[511815.9,73481.6],"p":[449.3,604.21],"reg":"SI037","dom":"bridge","doms":["bridge"],"designer":"Ponting Bridges with Pipenbaher Consulting Engineers and Jereb in Budja Architects","opened":"May 2023. The design won an open competition in 2017 against thirteen entries.","hist":"The footbridge at Irca vas is the first stress ribbon bridge in Slovenia and crosses the Krka between Lastovce and Groblje. Ponting gives a span of 130 m, a width of 4 m and a deck thickness of 42 cm, assembled from 46 precast segments installed on fully tensioned bearing cables between anchored concrete block abutments. Freyssinet describes the same structure with a main span of 120.5 m and six tendons, and states that the grouted tendons are thought to be a first of their kind on this bridge type. The client was the City Municipality of Novo mesto and the contractor was a joint venture of Freyssinet Adria and CGP Novo mesto. The bridge received the Golden Pencil award in 2023 and the Plecnik Medal in 2024, and it was officially named Stukljeva brv after the Olympic gymnast Leon Stukelj.","facts":[["Span","130 m per Ponting, 120.5 m main span per Freyssinet"],["Width","4 m, deck thickness 42 cm"],["Deck","46 precast segments on six tensioned bearing cables"],["Completed","May 2023, competition won 2017"],["Awards","Golden Pencil 2023, Plecnik Medal 2024"],["Official name","Stukljeva brv, after Leon Stukelj"]],"zagn":"Documented. The load testing paper for this bridge is recorded in DiRROS with ZAG as the organisational affiliation, and the ZAG authors include Dorde Dukic, Doron Hekic, Mirko Kosic, Rok Vezocnik and Andrej Anzlin. The testing took place in March 2023 and comprised three stage static loading, dynamic testing with a light truck driven over artificial obstacles, and ambient vibration measurement."},{"id":"crna","n":"Črna na Koroškem Bridge","sl":"Most v Črni na Koroškem","cls":"doc","cat":"bridge","lat":46.4697417,"lon":14.8489639,"prec":"locality","loc":"Črna na Koroškem","crosses":"Meža","carries":"Local road","built":2024,"len_m":null,"spans":1,"typ":"Reused precast prestressed girders on new abutments","role":"Structural reuse of salvaged girders","detail":"Built under the CIRCUIT project, which demonstrates circular practice in construction. The girders were recovered from a bridge that was being demolished, assessed for residual capacity, and reused in the new structure rather than being crushed for aggregate. ZAG carried out the assessment work.","people":[],"partners":["Direkcija RS za infrastrukturo"],"years":"2023-2024","src":["zag_crna","bilten2024","zag_bridges_svc"],"note":"Coordinate is the settlement centre, not the bridge itself.","tm":[488400.8,147796.7],"p":[443.61,589.55],"reg":"SI033","dom":"mat","doms":["mat","bridge"],"hist":"The bridge carries a local road over the Meza at Crna na Koroskem and was rebuilt in 2024 under the CIRCUIT project, which demonstrates circular practice in construction. Precast prestressed girders recovered from a bridge that was being demolished were assessed for residual capacity and reused in the new structure on new abutments, instead of being crushed for aggregate. The client was the Slovenian Infrastructure Agency.","facts":[["Approach","reuse of salvaged precast prestressed girders"],["Built","2024"],["Programme","CIRCUIT, circular construction"],["Client","Direkcija RS za infrastrukturo"]],"zagn":"Documented in the ZAG bilten. ZAG carried out the assessment of residual capacity that made the reuse possible."},{"id":"verd","n":"Verd Viaduct","sl":"Viadukt Verd","cls":"doc","cat":"bridge","lat":45.95555,"lon":14.30524,"prec":"surveyed","loc":"Verd, Vrhnika","crosses":"Ljubljanica headwaters plain","carries":"A1 motorway","built":null,"len_m":null,"spans":null,"typ":"Prestressed concrete viaduct","role":"First Slovenian application of an expansive grout additive","detail":"The first structure on which the Ikaton expansive additive was used for grouting prestressing cable ducts. The additive compensates for the shrinkage of cement grout so that the duct fills completely and the tendon is protected from corrosion. Built by Beograjska Mostogradnja. The additive line was developed at ZAG.","people":[],"partners":["DARS"],"years":null,"src":["bilten2024","zag_bridges_svc","gv_verd"],"note":"Coordinate is a representative point on the viaduct itself, which is about 600 m long, not a specific pier.","tm":[446143.9,90870.9],"p":[435.82,601.59],"reg":"SI041","dom":"mat","doms":["mat","bridge"],"hist":"The viaduct carries the A1 motorway across the plain at the headwaters of the Ljubljanica near Vrhnika and was built by Beograjska Mostogradnja. It was the first structure on which the Ikaton expansive additive was used for grouting prestressing cable ducts. The additive compensates for the shrinkage of cement grout so that the duct fills completely and the tendon is protected from corrosion, which is one of the principal durability problems in post tensioned concrete bridges.","facts":[["First application","Ikaton expansive grout additive, first use in Slovenia"],["Purpose","complete filling of prestressing cable ducts"],["Contractor","Beograjska Mostogradnja"],["Owner","DARS"]],"zagn":"Documented in the ZAG bilten. The expansive additive line used here was developed at ZAG."},{"id":"he_solkan","n":"HE Solkan","sl":"Hidroelektrarna Solkan","cls":"doc","cat":"dam","lat":45.9694972,"lon":13.6454917,"prec":"locality","loc":"Solkan, Nova Gorica","crosses":"Soča","carries":null,"built":1984,"len_m":null,"spans":null,"typ":"Run-of-river hydroelectric plant","role":"Expansive and non-shrink cement grouts","detail":"One of the hydroelectric plants where ZAG grout formulations were used for cable duct grouting and non-shrink structural grouting. The work sits in a long ZAG line of research on expansive cements and additives.","people":[],"partners":["Soške elektrarne Nova Gorica"],"years":null,"src":["bilten2024","seng_solkan","seng_he","gd2025_dams"],"note":"Coordinate is the settlement of Solkan.","tm":[395028.5,93078.4],"p":[425.47,601.83],"reg":"SI043","dom":"energy","doms":["energy","mat"],"operator":"Soske elektrarne Nova Gorica, part of the HSE group","opened":"1984, in operation since 15 November 1984. Construction began in 1978.","hist":"HE Solkan is the lowest and the youngest of the large plants on the Soca, standing roughly 700 m upstream of the Solkan railway bridge. It is a run of river plant with three Kaplan units, a combined swallowing capacity of 180 cubic metres per second and a gross head of 20.55 m at that flow. The reservoir holds about 1.15 million cubic metres of useful storage, the permitted water level fluctuation is 1.5 m, and the catchment is 1,632 square kilometres. Average annual generation is about 105 GWh. In July 2022 the plant stopped generating entirely because the Soca fell below the flow needed to run a single unit. The operator brochure records that a reconstruction is planned for after 2025.","facts":[["Installed capacity","32.4 MW"],["Turbines","3 Kaplan, 10.8 MW each at 214.3 rpm"],["Installed flow","180 cubic metres per second"],["Gross head","20.55 m"],["Annual generation","about 105 GWh"],["Catchment","1,632 square kilometres"],["Useful storage","about 1.15 million cubic metres"]],"zagn":"A 2025 paper by Stefan and Zvanut for the 53rd Slovenian geodetic day states that for the last three decades ZAG, with partners, has carried out the technical observation of most dam structures of the Slovenian hydroelectric plants, covering all ten dams on the Drava and all three on the Soca, and that the monitoring schemes were originally prepared by the Zavod za raziskavo materiala in konstrukcij, the predecessor of ZAG. The paper does not name this plant individually, so the statement applies to the programme as a whole."},{"id":"he_zlatolicje","n":"HE Zlatoličje","sl":"Hidroelektrarna Zlatoličje","cls":"doc","cat":"dam","lat":46.4479,"lon":15.7868,"prec":"surveyed","loc":"Zlatoličje, Starše","crosses":"Drava","carries":null,"built":1969,"len_m":null,"spans":null,"typ":"Run-of-river hydroelectric plant on a diversion canal, 136 MW","role":"Expansive and non-shrink cement grouts","detail":"Named in ZAG material as one of the hydroelectric plants where ZAG expansive and non-shrink grouts were applied. The plant works from a diversion canal rather than directly on the Drava channel.","people":[],"partners":["Dravske elektrarne Maribor"],"years":null,"src":["bilten2024","wp_zlat","dem_zlat","hse_zlat","ep_zlat","gd2025_dams"],"note":"Coordinate is the powerhouse near Zlatolicje, from an energy infrastructure database. The Melje weir that feeds it stands 17.2 km upstream in Maribor.","tm":[560448.3,145658.8],"p":[458.17,589.0],"reg":"SI032","dom":"energy","doms":["energy","mat"],"operator":"Dravske elektrarne Maribor, part of the HSE group","opened":"First unit in test operation 19 October 1968, second unit April 1969, official opening 26 April 1969. Built from autumn 1964.","rebuilt":"Comprehensive refurbishment of the plant, the Melje weir and construction of the small plant MHE Melje ran from 2006 to 2013, completed formally in June 2014 at a cost of about 62 million euros.","hist":"HE Zlatolicje is the most powerful hydroelectric plant in Slovenia and was the first canal type plant built in the former state. Water is taken from the Drava at the Melje weir in Maribor and carried 17.2 km along a trapezoidal intake canal, largely on embankment, to the powerhouse near Zlatolicje, then returned to the Drava through a 6.2 km outflow canal cut deep into the ground. Between 2006 and 2013 both turbines and both generators were replaced along with the primary and secondary electrical equipment and the control systems, all six gates of the Melje weir were raised, and the dam and spillway wall were structurally reinforced. The replacement runner fitted to unit 2 has a diameter of 5,894 mm and a mass of 96 tonnes. Installed flow rose from 450 to 530 cubic metres per second and installed capacity rose by 12 MW. The small plant MHE Melje, running on the ecological minimum flow, entered service in January 2009.","facts":[["Installed capacity","126 MW after refurbishment"],["Annual generation","about 577 GWh"],["Intake canal","17.2 km, outflow canal 6.2 km"],["Installed flow","530 cubic metres per second, raised from 450"],["Melje weir","six spillway gates, all raised in the works"],["Refurbishment","2006 to 2013, about 62 million euros"],["Unit 2 runner","5,894 mm diameter, 96 tonnes"]],"zagn":"A 2025 paper by Stefan and Zvanut for the 53rd Slovenian geodetic day states that for the last three decades ZAG, with partners, has carried out the technical observation of most dam structures of the Slovenian hydroelectric plants, covering all ten dams on the Drava and all three on the Soca, and that the monitoring schemes were originally prepared by the Zavod za raziskavo materiala in konstrukcij, the predecessor of ZAG. The paper does not name this plant individually, so the statement applies to the programme as a whole."},{"id":"he_vuhred","n":"HE Vuhred","sl":"Hidroelektrarna Vuhred","cls":"doc","cat":"dam","lat":46.5876,"lon":15.2756,"prec":"surveyed","loc":"Vuhred, Radlje ob Dravi","crosses":"Drava","carries":null,"built":1956,"len_m":null,"spans":null,"typ":"Run-of-river hydroelectric plant","role":"Expansive and non-shrink cement grouts","detail":"Named in ZAG material alongside Zlatoličje and Solkan as a site where ZAG grout formulations were used.","people":[],"partners":["Dravske elektrarne Maribor"],"years":null,"src":["bilten2024","wp_vuh","dem_vuh","dem_lp19","gd2025_dams"],"note":"Coordinate is the powerhouse and weir on the Drava, from an energy infrastructure database.","tm":[521119.7,160922.6],"p":[450.04,586.46],"reg":"SI033","dom":"energy","doms":["energy","mat"],"operator":"Dravske elektrarne Maribor, part of the HSE group","opened":"1956 for the first two units, third unit in 1958","rebuilt":"Modernised between 1999 and 2004, with physical work from July 2001 and roughly one unit a year. All three units were rebuilt, the plant was equipped for remote control from Maribor, and rated turbine power rose from about 59 MW to about 74 MW.","hist":"HE Vuhred is a run of river plant on the Drava in the municipality of Radlje ob Dravi, the fourth in the chain from the Austrian border. Two units entered service in 1956 and a third followed in 1958, giving three Kaplan turbines of 24.1 MW each. The design flow is 550 cubic metres per second and the head is 17.41 m. The weir has four spillway fields, each 17 m wide, with a maximum discharge capacity of 5,800 cubic metres per second. The reservoir extends 13.1 km at full supply level and holds 10.3 million cubic metres, of which 2.2 million are usable for generation. During the refurbishment the supplier replaced the entire stator winding of generator 3 because the original bars, made to a different technology, overheated. The plant now runs without permanent staff on site.","facts":[["Installed capacity","72.3 MW"],["Turbines","3 Kaplan, 24.1 MW each"],["Design flow","550 cubic metres per second"],["Head","17.41 m"],["Annual generation","about 297 GWh, about 12 per cent of DEM output"],["Weir","four spillway fields of 17 m, capacity 5,800 cubic metres per second"],["Reservoir","13.1 km long, 10.3 million cubic metres, 2.2 million usable"]],"zagn":"A 2025 paper by Stefan and Zvanut for the 53rd Slovenian geodetic day states that for the last three decades ZAG, with partners, has carried out the technical observation of most dam structures of the Slovenian hydroelectric plants, covering all ten dams on the Drava and all three on the Soca, and that the monitoring schemes were originally prepared by the Zavod za raziskavo materiala in konstrukcij, the predecessor of ZAG. The paper does not name this plant individually, so the statement applies to the programme as a whole."},{"id":"strunjan","n":"Sveti Križ Bay Cliff","sl":"Zaliv Sv. Križa v Strunjanu","cls":"doc","cat":"geo","lat":45.537465,"lon":13.610151,"prec":"surveyed","loc":"Strunjan, Piran","crosses":null,"carries":null,"built":null,"len_m":null,"spans":null,"typ":"Flysch sea cliff","role":"Rockfall investigation and slope characterisation","detail":"ZAG investigated a coastal rockfall of roughly 2,000 cubic metres between 2019 and 2021, combining geological mapping, geodetic remote sensing and geomechanical laboratory testing of samples taken from the cliff. The work sits within ZAG's wider study of erosion on the unstable flysch cliffs of the Slovenian coast.","people":[],"partners":[],"years":"2019-2021","src":["lp2021","ksp_klif","ulj_klif","ags_klif","drones_klif","ksp_nu"],"note":"Coordinate is the bay of Sveti Kriz at the foot of the cliff, not the cliff crest.","tm":[391455.2,45111.9],"p":[425.37,611.54],"reg":"SI044","dom":"geo","doms":["geo"],"hist":"The Strunjan cliff is the highest and the longest flysch sea cliff on the Adriatic, rising to about 80 m at Cape Ronek and running roughly 4 km between Capes Kane and Ronek. It is the longest stretch of undeveloped natural shoreline on the 130 km of coast between Grado in Italy and Savudrija in Croatia. The rock is middle Eocene flysch, a rhythmic alternation of conglomerate, sandstone, mudstone, marlstone and occasional limestone megabeds laid down in deep water about 40 million years ago and later folded and uplifted. Waves cut notches at the base until the overlying sandstone and limestone beds break away, while rain, sun and wind break up the upper face, and the park authority states that the cliff retreats inland at roughly one centimetre a year. Rockfall is frequent and documented: about 2,000 cubic metres of flysch collapsed in late 2019 and blocks of one to six tonnes fell in the bay of Sveti Kriz in August 2023. The cliff, its vegetated crest and a 200 m belt of sea below it are protected as a nature reserve inside the Strunjan Landscape Park.","facts":[["Height","up to about 80 m at Cape Ronek"],["Length","about 4 km between Capes Kane and Ronek"],["Rock","middle Eocene flysch, about 40 million years old"],["Retreat rate","about one centimetre a year, per the park authority"],["2019 collapse","about 2,000 cubic metres"],["2023 rockfall","blocks of one to six tonnes in the bay of Sveti Kriz"]],"zagn":"Documented. The University of Ljubljana reports that the project on erosion of the coastal flysch cliffs with risk assessment, covering Strunjan, Debeli rtic, Seca and the Piran to Fiesa path, was carried out by the Department of Geology of the UL Faculty of Natural Sciences and Engineering, the UL Faculty of Civil and Geodetic Engineering and the Zavod za gradbenistvo. The work combined geological and engineering geological field investigation, laboratory geomechanical testing, drone photogrammetry, lidar scanning and GIS hazard mapping."},{"id":"sitarjevec","n":"Sitarjevec Mine","sl":"Rudnik Sitarjevec v Litiji","cls":"doc","cat":"geo","lat":46.049342,"lon":14.830746,"prec":"address","loc":"Litija","crosses":null,"carries":null,"built":null,"len_m":null,"spans":null,"typ":"Former lead, zinc and barite mine","role":"Characterisation of mine ochre as a pigment","detail":"ZAG characterised the yellow limonite mud that forms in the mine and assessed it as a source of natural pigment for artistic and textile use. The work is an example of the institute's materials side rather than its structures side.","people":[],"partners":[],"years":"2021","src":["lp2021","rs_mine","lit_mine","lit_minetour","vl_mine"],"note":"Coordinate is the visitor entrance at Sitarjevska cesta 46, as published by the tourist board.","tm":[486902.0,101074.1],"p":[443.91,598.99],"reg":"SI035","dom":"geo","doms":["geo","mat"],"hist":"Sitarjevec is a polymetallic mine on the hill above Litija that worked lead and mercury ores and later zinc, copper, iron bearing material and barite, the choice following market demand and price. Mining on the hill goes back to prehistory, the earliest written evidence is the 1537 gravestone of the mining master Cristof Bruckherschmidt, and a smelter operated from 1881. Work stopped at the end of July 1965 because the remaining ore was too poor, the recovery technology outdated and silicosis widespread among the miners, and the adits were then blasted shut. After 2000 limonite speleothems were discovered in the abandoned workings, iron and manganese formations regarded as among the finest in Europe, some of which grow up to 5 cm a year. The municipality rehabilitated part of the mine between 2017 and 2019, creating 632 m of museum routes, and guided tours began in December 2017 with the Glavni rov opening on 22 April 2021.","facts":[["Closed","end of July 1965"],["Minerals recorded","more than sixty species"],["Ore minerals","galena, sphalerite, cinnabar, chalcopyrite, barite"],["Limonite speleothems","some growing up to 5 cm a year"],["Visitor routes","632 m, opened from December 2017"],["Conditions underground","about 10 degrees Celsius, 100 per cent humidity"]],"zagn":"Documented. ZAG was a partner in the Interreg Slovenia to Croatia project MINE TOUR, which ran from 1 September 2018 to 28 February 2021 and covered Rudnik Sitarjevec and Labin, and it prepared the heritage interpretation content for the project. An earlier municipal report of 20 March 2017 records ZAG as the lead partner of the application that preceded it. Separately, ZAG characterised the yellow limonite mud that forms in the mine and assessed it as a source of natural pigment."},{"id":"zag","n":"ZAG","sl":"Zavod za gradbeništvo Slovenije","cls":"inst","cat":"inst","lat":46.0657,"lon":14.5128,"prec":"address","loc":"Dimičeva ulica 12, Ljubljana","role":"Slovenian National Building and Civil Engineering Institute","detail":"Founded 1994. 255 staff, six research and testing departments, a metrology department and three notified-body services under the Construction Products Regulation. Home of SiWIM bridge weigh-in-motion and of the BrAId project applying machine learning to B-WIM data quality.","src":["zagbridges","zag_bridges_svc","zag_about","zag_hist","zag_cert","sa_lp005","sicris_org","zag_contact","bilten2024"],"p":[438.92,598.93],"tm":[462308.4,102993.7],"reg":"SI041","dom":"inst","doms":["inst","build","mat","bridge"],"groups":["g_struct","g_stone","g_phys","g_metal","g_geo","g_org","g_conc","g_metro"],"opened":"Founded 18 July 1949. ZAG in its present form was registered on 17 March 1995 and began operating on 1 April 1995.","hist":"The institute traces its origin to 18 July 1949, when the first building and civil engineering institute in Slovenia was set up with twelve staff. It was renamed the Institute for Testing and Research in Materials and Structures, ZRMK Ljubljana, in 1952, by which time it had grown to 150 employees and had its own building on Dimiceva. After independence the government reorganised ZRMK in 1994 and 1995 and split it into two bodies. ZAG was registered on 17 March 1995 and began operating on 1 April 1995 as a governmental non profit research institute, a status that lets it act as an independent third party in testing and certification. It is organised into five departments, Materials, Building Physics, Fire Safe Sustainable Built Environment, Structures, and Geotechnics and Infrastructure, together with the Laboratory for Metrology, the Certification Service and the Service for Technical Assessment and Approvals.","facts":[["Address","Dimiceva ulica 12, 1000 Ljubljana"],["Origin","18 July 1949, twelve staff"],["Present institute","registered 17 March 1995, operating from 1 April 1995"],["Notified body","number 1404 under Regulation (EU) No 305/2011"],["Accreditation","Slovenska akreditacija LP-005, SIST EN ISO/IEC 17025, first awarded 11 November 1999"],["Certification","SIST EN ISO/IEC 17065"],["Registered researchers in SICRIS","200, in 8 research groups"],["Departments","5, plus metrology, certification and technical approvals"]],"zagn":"This page is the institute itself. The staff figures come from two different counts. The ZAG history page states more than 80 experts with university qualifications, about half of whom also hold academic titles, while the SICRIS record lists 200 registered researchers. The two count different populations and should not be added together."},{"id":"zag_logatec","n":"ZAG Fire Laboratory Logatec","sl":"Požarni laboratorij ZAG Logatec","cls":"inst","cat":"inst","lat":45.91795,"lon":14.24163,"prec":"address","loc":"Logatec","crosses":null,"carries":null,"built":2022,"len_m":null,"spans":null,"typ":"Fire testing laboratory","role":"Fire resistance and reaction to fire testing","detail":"Opened in 2022 and staffed by around twenty five people. It carries out fire resistance and reaction to fire testing on construction products and assemblies, including large scale furnace tests that the older Gameljne facility could not accommodate.","people":[],"partners":[],"years":"2022-","src":["bilten2024","zag_pozar_odp","pl_logatec","zag_fireres","zag_contact","tis_logatec"],"note":"Coordinate is the directory geocode of Obrtna cona 35, not a surveyed point on the laboratory building.","tm":[441173.3,86737.0],"p":[434.87,602.49],"reg":"SI041","dom":"fire","doms":["fire","inst"],"opened":"Opened 2 September 2022","hist":"ZAG opened its Fire Laboratory at Obrtna cona 35 in Logatec on 2 September 2022, describing it as the largest facility of its kind in this part of Europe. The building has 3,421.70 square metres of gross floor area and holds two large furnaces with an exhaust gas cleaning plant. Specimens can be tested from microscale up to 4 m by 8 m. The declared project cost was 9,227,065.78 euros excluding VAT, made up of 1,660,554.40 euros from the state budget through the ministry, 4,305,077.38 euros of ZAG funds, 2,896,586.00 euros of ERDF funds through InnoRenew and 364,848.00 euros from ARRS, with the total including equipment reported as close to 11 million euros. Fire resistance testing covers non load bearing walls, ceilings and suspended facades, load bearing walls, ceilings, roofs, beams, columns, balconies and stairs, fire and smoke doors and windows with their hardware, protective systems for concrete, steel and timber, ventilation ducts, fire dampers, cable systems and smoke and heat control systems.","facts":[["Address","Obrtna cona 35, 1370 Logatec"],["Opened","2 September 2022"],["Gross floor area","3,421.70 square metres"],["Largest specimen","4 m by 8 m"],["Furnaces","two, with an exhaust gas cleaning plant"],["Project cost","9,227,065.78 euros excluding VAT, close to 11 million with equipment"],["Classification standards","SIST EN 13501 parts 1 to 5"]],"zagn":"Documented. The laboratory is ZAG own and is described on the institute website and on the dedicated project site. The exhaust cleaning plant was co financed half and half with InnoRenew CoE."},{"id":"zag_gameljne","n":"ZAG Fire Laboratory Gameljne","sl":"Požarni laboratorij ZAG Gameljne","cls":"inst","cat":"inst","lat":46.1216,"lon":14.4907,"prec":"locality","loc":"Zgornje Gameljne, Ljubljana","crosses":null,"carries":null,"built":1986,"len_m":null,"spans":null,"typ":"Fire testing laboratory","role":"Fire testing, original ZAG fire facility","detail":"ZAG built its first dedicated fire laboratory here in 1986. It remained the institute's fire testing base until the Logatec laboratory opened.","people":[],"partners":[],"years":"1986-","src":["bilten2024","zag_contact"],"note":"Coordinate is the settlement of Zgornje Gameljne.","tm":[460638.4,109217.2],"p":[438.51,597.7],"reg":"SI041","dom":"fire","doms":["fire","inst"],"hist":"ZAG built its first dedicated fire laboratory here in 1986 and it remained the fire testing base of the institute until the Logatec laboratory opened in 2022.","zagn":"Reported in the ZAG bilten. The current ZAG contacts page lists only three locations, Ljubljana, Miklavz na Dravskem polju and Logatec, so this site is shown as the historical fire testing base and not as a current address.","facts":[["Built","1986, the first dedicated ZAG fire laboratory"],["Role","fire testing base of the institute until 2022"],["Succeeded by","the Logatec Fire Laboratory, opened September 2022"]]},{"id":"zag_maribor","n":"ZAG Maribor Unit","sl":"ZAG enota Maribor, Dobrovce","cls":"inst","cat":"inst","lat":46.48223,"lon":15.70206,"prec":"address","loc":"Dobrovce, Miklavž na Dravskem polju","crosses":null,"carries":null,"built":2021,"len_m":null,"spans":null,"typ":"Regional laboratory and office","role":"ZAG regional unit for north-east Slovenia","detail":"Opened in 2021, replacing the 1972 Maribor premises. It serves construction testing and site work across Podravska and Pomurska.","people":[],"partners":[],"years":"2021-","src":["bilten2024","zag_contact","vecer_mb","tis_mb"],"note":"Coordinate is the directory geocode of Kidriceva cesta 47 in Dobrovce.","tm":[553904.0,149413.2],"p":[456.8,588.33],"reg":"SI032","dom":"inst","doms":["inst"],"opened":"Present premises opened 19 October 2021","hist":"The Maribor business unit is at Kidriceva cesta 47, Dobrovce, 2204 Miklavz na Dravskem polju. It moved there from Gorkega ulica 1 in Maribor and the new premises opened on 19 October 2021. The unit occupies a renovated three storey building of 480 square metres, with offices and laboratories taking the whole of the ground floor, and the investment was about 300,000 euros. It has ten employees. The then director Ales Znidaric explained the move as driven by the formation of the cohesion regions and by the wish to bring together research laboratories that had been dispersed across several locations. The work of the unit spans materials, building physics, structures, geotechnics, transport infrastructure and metrology.","facts":[["Address","Kidriceva cesta 47, Dobrovce, 2204 Miklavz na Dravskem polju"],["Opened","19 October 2021"],["Building","three storeys, 480 square metres"],["Employees","10"],["Investment","about 300,000 euros"]],"zagn":"Documented. The unit is listed on the ZAG contacts page and the Vecer report names the institute and quotes its director."},{"id":"cestel","n":"Cestel d.o.o.","sl":"Cestel cestni inženiring d.o.o.","cls":"inst","cat":"inst","dom":"ai","doms":["ai","inst"],"lat":46.11727,"lon":14.54599,"prec":"address","loc":"Trzin","crosses":null,"carries":null,"built":null,"len_m":null,"spans":null,"typ":"Engineering company, maker of the SiWIM bridge weigh-in-motion system","role":"Industrial partner on bridge weigh-in-motion work","detail":"SiWIM grew out of the weigh-in-motion research ZAG has run since the 1990s. Cestel supplies and operates the systems, and is a partner alongside ZAG in the BRIDGITISE doctoral network and on the Tomačevo bridge installation.","people":[],"partners":["ZAG","UL FGG"],"years":null,"src":["cestel","cordis_bridgitise","iswim_cestel","ucd2009","dewesoft","mp_cestel"],"note":"Coordinate is a geocode of the company address at Spruha 32 in Trzin.","tm":[464908.8,108710.1],"p":[439.37,597.75],"reg":"SI041","hist":"Cestel d.o.o. is at Spruha 32 in Trzin and states more than thirty years of experience in bridge weigh in motion measurement, traffic analysis and bridge assessment. Its product is SiWIM, presented as the first fully portable high speed weigh in motion system, which uses strain gauge sensors to collect data on heavy goods vehicles and on the bridge at the same time. The system measures gross vehicle weight, axle loads, axle spacing and speed, can be installed in less than a day without closing the road, and delivers data through web applications. The International Society for Weigh in Motion records that Cestel introduced SiWIM in 1999. The system is used for maintenance planning, for vehicle preselection in enforcement, and for bridge assessment.","facts":[["Address","Spruha 32, 1236 Trzin"],["Product","SiWIM bridge weigh in motion, introduced 1999"],["Installation","under one day, no road closure"],["Measures","gross weight, axle loads, axle spacing, speed"]],"zagn":"Documented. The paper by OBrien, Gonzalez, Dowling and Znidaric states that the SiWIM system was developed by the Slovenian National Building and Civil Engineering Institute, ZAG, and manufactured by Cestel. ZAG and Cestel are also named together as collaborators on the Tomacevo installation."},{"id":"innorenew","n":"InnoRenew CoE","sl":"InnoRenew CoE, Izola","cls":"inst","cat":"inst","dom":"inst","doms":["inst","mat"],"lat":45.53022,"lon":13.64899,"prec":"address","loc":"Izola","crosses":null,"carries":null,"built":2017,"len_m":null,"spans":null,"typ":"Research and innovation centre of excellence for renewable materials","role":"Partner institute, ZAG is a founding partner","detail":"Set up under the Horizon 2020 teaming action with ZAG among the partners. It works on renewable building materials and healthy indoor environments. Friderik Knez led ZAG's side of the project from 2017 to 2022.","people":["Friderik Knez (ZAG)"],"partners":["University of Primorska","Fraunhofer WKI"],"years":"2017 to 2022","src":["innorenew","zag_intl","innorenew_prj","innorenew_up","pl_logatec","innorenew_c"],"note":"Coordinate is the map pin the institute publishes on its own contact page, for Livade 6 in Izola.","tm":[394474.9,44254.9],"p":[425.99,611.67],"reg":"SI044","opened":"Established 15 February 2017","hist":"InnoRenew CoE is at Livade 6a in Izola and works on renewable materials and sustainable building. Its two distinguishing fields are wood modification and restorative environmental and ergonomic design. A consortium of ten partners led by the University of Primorska submitted the proposal to Horizon 2020 in 2016, and ZAG was one of the core partners. The Horizon 2020 Teaming operation was valued at 14,996,025.00 euros including tax, with national co financing of about 39 million euros, giving a total of about 54 million euros. By court decision of 29 July 2025 the institute became an independent research department within the Andrej Marusic Institute of the University of Primorska. Over eight and a half years it had run 96 publicly funded projects worth 15.78 million euros together with industry projects worth 2.81 million euros.","facts":[["Address","Livade 6a, 6310 Izola"],["Teaming operation","14,996,025.00 euros including tax"],["Total project value","about 54 million euros"],["Core fields","wood modification, restorative environmental and ergonomic design"],["Track record","96 publicly funded projects worth 15.78 million euros"]],"zagn":"Documented. ZAG is named as one of the core partners of the InnoRenew consortium. The ZAG Logatec Fire Laboratory received 2,896,586.00 euros of ERDF funding through InnoRenew, and the exhaust cleaning plant there was co financed half and half with InnoRenew CoE."},{"id":"ulfgg","n":"UL FGG","sl":"Fakulteta za gradbeništvo in geodezijo","cls":"inst","cat":"inst","lat":46.0455,"lon":14.4945,"prec":"address","loc":"Jamova cesta 2, Ljubljana","role":"Faculty of Civil and Geodetic Engineering, University of Ljubljana","detail":"ZAG's nearest academic partner, five kilometres away. Co-supervises BRIDGITISE doctoral candidates and co-authors the Tomačevo influence-line work.","src":["ulfgg_s0","ulfgg_hist","ulfgg_dep","sensors2023"],"p":[438.66,599.4],"tm":[460878.3,100757.5],"reg":"SI041","dom":"inst","doms":["inst"],"hist":"UL FGG is at Jamova cesta 2 in Ljubljana. Civil engineering teaching in Slovenia began in 1919, when the Department of Civil Engineering started courses at the Technical Faculty. The faculty passed through several reorganisations, becoming a department within the Technical Faculty in 1954 and part of the Faculty of Architecture, Civil and Geodetic Engineering in 1957, before becoming an independent member of the University of Ljubljana on 1 January 1995. It has three departments, Civil Engineering with twelve units including the chairs of structural and earthquake engineering, of mechanics and of geotechnical engineering, Geodetic Engineering with five chairs, and Environmental Civil Engineering. It also runs the Institute of Structural Engineering, Earthquake Engineering and Construction IT, the Water Management Institute, and hydraulic and structural testing laboratories.","facts":[["Address","Jamova cesta 2, 1000 Ljubljana"],["Teaching from","1919"],["Independent faculty","1 January 1995"],["Departments","Civil Engineering, Geodetic Engineering, Environmental Civil Engineering"],["Programmes","5 first cycle, 5 second cycle, 2 doctoral"]],"zagn":"Documented through joint work. UL FGG and ZAG co author the bridge monitoring papers used in this atlas, including the Ravbarkomanda model updating work, and the doctoral research of DC04 within BRIDGITISE is hosted by ZAG in collaboration with UL FGG."},{"id":"karavanke_c","n":"Karavanke Motorway Tunnel","sl":"Predor Karavanke, avtocesta","cls":"doc","cat":"tunnel","lat":46.45371,"lon":13.99048,"prec":"surveyed","loc":"Hrusica, Jesenice","crosses":null,"carries":"A2 under the Karavanke range to Austria","built":null,"len_m":null,"spans":null,"typ":null,"role":"Tunnel construction quality control","detail":"Repair works, with external control of the works.","people":[],"partners":[],"years":"1990-2016","src":["zag_tunnels","structurae"],"p":[430.31,590.7],"tm":[422448.8,146499.0],"reg":"SI042","dom":"tunnel","doms":["tunnel"],"hist":"","facts":[["Client","DARS"],["Years","1990 to 2016"],["Position","a published coordinate"]],"note":"The published coordinate is the Slovenian portal of the second tube. The 1991 tube lies immediately alongside it.","zagn":"Documented. ZAG names this tunnel in the reference list on its own tunnels and underground structures page. Repair works, with external control of the works.","client":"DARS"},{"id":"karavanke_r","n":"Karavanke Railway Tunnel","sl":"Predor Karavanke, zeleznica","cls":"doc","cat":"tunnel","lat":46.44924,"lon":14.01555,"prec":"surveyed","loc":"Jesenice","crosses":null,"carries":"Jesenice to Rosenbach railway","built":null,"len_m":null,"spans":null,"typ":null,"role":"Tunnel construction quality control","detail":"Repair works, with external control of the works.","people":[],"partners":[],"years":"1990-2016","src":["zag_tunnels","structurae"],"p":[430.71,590.78],"tm":[424368.5,145977.8],"reg":"SI042","dom":"tunnel","doms":["tunnel"],"hist":"","facts":[["Client","DARS"],["Years","1990 to 2016"],["Position","a published coordinate"]],"note":"","zagn":"Documented. ZAG names this tunnel in the reference list on ":"catez_bridge","n":"Čatež Bridge over the Sava","sl":"Most čez Savo pri Čatežu","cls":"doc","cat":"bridge","prec":"settlement","loc":"Čatež ob Savi, Brežice","crosses":"Sava","carries":"Regional road","built":null,"len_m":359.8,"spans":12,"typ":"Prestressed reinforced concrete girder bridge on circular column piers and two wall piers","role":"Combined earthquake and flood vulnerability assessment","detail":"Within the CROSScade project the bridge was selected as the most critical of seven bridges in the Sava reach below the Brežice hydropower plant. Reasons given were its role on a key regional route, the lack of adequate scour protection and a design that predates modern performance-based seismic provisions. The first half of the bridge was modelled in Midas Civil and OpenSeesPy with soil-structure interaction, and fragility curves were derived for sequential ground shaking, flood loading and local pier scour.","people":["Mirko Kosič (ZAG)","Andrej Anžlin (ZAG)","Gašper Rak (UL FGG)","Gorazd Novak (UL FGG)","Matjaž Četina (UL FGG)"],"partners":["UL FGG","University of Zagreb"],"years":"2022-2025","src":["crosscade_2025"],"note":"The position is the centre of Čatež ob Savi, Brežice, not a surveyed point on the bridge.","dom":"bridge","doms":["bridge","quake"],"hist":"The Čatež bridge carries a regional road across the Sava close to the Slovenia to Croatia border. It is a 12 span prestressed reinforced concrete girder bridge, 359.8 m long, designed in the mid 1970s. It is divided into four brake units by expansion joints. The intermediate piers are pairs of 1.2 m circular columns on bored piles, while piers 5 and 9 are transverse reinforced concrete walls on a pile cap with six inclined piles.","facts":[["Length","359.8 m, 12 spans"],["Spans","29.4 m outer, 30.1 m inner"],["Designed","mid 1970s"],["Brake units","four, separated by expansion joints"],["Analysis","non-linear time-history, earthquake followed by flood and scour"],["Project","CROSScade, Union Civil Protection Mechanism"]],"zagn":"Documented. The 2025 Infrastructures paper on the CROSScade project lists Mirko Kosič and Andrej Anžlin with the Slovenian National Building and Civil Engineering Institute as affiliation, and the paper's bridge vulnerability assessment is carried out on this bridge.","lat":45.8926,"lon":15.59788,"tm":[546399,83814],"p":[456.14,601.65],"reg":"SI036"},{"id":"maribor_pilots","n":"Maribor circular economy pilot sites","sl":"Pilotne lokacije krožnega gospodarstva, Maribor","cls":"doc","cat":"other","prec":"settlement","loc":"Maribor","crosses":null,"carries":null,"built":null,"len_m":null,"spans":null,"typ":"Pilot production plant, demonstration building, degraded site revitalisation and urban soil production","role":"Demonstration of secondary raw materials in urban construction and urban soil","detail":"CINDERELA, coordinated by ZAG, established a pilot production plant for construction products from waste in Maribor, planned a one storey demonstration building made with recycled aggregates and recycled soil, and carried out preliminary geotechnical investigation for revitalising a degraded area. URBAN SOIL 4 FOOD, an Urban Innovative Actions project led by the City of Maribor with ZAG as a partner, tested a pilot system for producing certified urban soil from city waste and used it in community gardens.","people":[],"partners":["City of Maribor","Snaga","Wcycle Institute Maribor","Nigrad"],"years":"2017-2022","src":["cinderela_pilots","cinderela_demo4","uia_us4f"],"note":"The sources place the pilots in Maribor without a street address, so the position is the centre of Maribor.","dom":"mat","doms":["mat","geo"],"hist":"Maribor hosted Slovenian pilots of two circular economy projects in which ZAG took part. The CINDERELA pilots cover production of construction products from non-hazardous construction and other waste, a demonstration building with green concrete and recycled aggregates, and geotechnical works with secondary raw materials on a degraded area. The URBAN SOIL 4 FOOD project used excavated materials and biological waste from the city to produce standardised soil for urban gardens.","facts":[["CINDERELA","Horizon 2020, grant 776751, ZAG coordinator"],["URBAN SOIL 4 FOOD","Urban Innovative Actions, ZAG partner"],["Demonstration building","one storey, green concrete with recycled aggregates"],["Urban gardens","more than 7,000 m2 planned"]],"zagn":"Documented. The CINDERELA site names ZAG as coordinator and describes the Maribor pilots, and the UIA project journal lists ZAG among the URBAN SOIL 4 FOOD partners.","lat":46.56247,"lon":15.64398,"tm":[549372,158294],"p":[455.77,586.6],"reg":"SI032"},{"id":"kamnik_bridges","n":"Kamnik Municipal Bridges","sl":"Mostovi v Občini Kamnik","cls":"doc","cat":"bridge","prec":"settlement","loc":"Kamnik","crosses":null,"carries":null,"built":null,"len_m":null,"spans":null,"typ":null,"role":"Assessment of damage to bridges","detail":"Assessment of the level of damage to bridges in the municipality.","people":[],"partners":[],"years":"2015","src":["zagbridges"],"note":"ZAG names the client and the year but not the individual bridges, so the pin marks the town. The position is the centre of Kamnik, not a surveyed point on any bridge.","dom":"bridge","doms":["bridge"],"hist":"","facts":[["Client","Municipality of Kamnik"],["Years","2015"],["Position","the settlement centre"]],"zagn":"Documented. ZAG lists the assessment of the level of damage to bridges in the municipality of Kamnik for the Municipality of Kamnik in 2015 in the reference list of its Section for Bridges and Other Civil Engineering Structures.","client":"Municipality of Kamnik","lat":46.22608,"lon":14.61083,"tm":[469980,120777],"p":[440.24,595.25],"reg":"SI041"},{"id":"sij_acroni_pavers","n":"Geopolymer Paving at SIJ Acroni","sl":"Geopolimerni tlakovci, SIJ Acroni","cls":"doc","cat":"other","prec":"settlement","loc":"Jesenice","crosses":null,"carries":null,"built":2024,"len_m":null,"spans":null,"t const A=6378137.0, F=1/298.257222101, E2=F*(2-F), K0=0.9999,
      LON0=15*Math.PI/180, FE=500000, FN=-5000000, EP2=E2/(1-E2);
function toTM(lon,lat){
  const p=lat*Math.PI/180, l=lon*Math.PI/180-LON0, s=Math.sin(p), c=Math.cos(p), t=Math.tan(p);
  const N=A/Math.sqrt(1-E2*s*s), T=t*t, C=EP2*c*c, a1=c*l;
  const M=A*((1-E2/4-3*E2*E2/64-5*E2*E2*E2/256)*p
      -(3*E2/8+3*E2*E2/32+45*E2*E2*E2/1024)*Math.sin(2*p)
      +(15*E2*E2/256+45*E2*E2*E2/1024)*Math.sin(4*p)
      -(35*E2*E2*E2/3072)*Math.sin(6*p));
  return [FE+K0*N*(a1+(1-T+C)*a1**3/6+(5-18*T+T*T+72*C-58*EP2)*a1**5/120),
          FN+K0*(M+N*t*(a1*a1/2+(5-T+9*C+4*C*C)*a1**4/24
                +(61-58*T+T*T+600*C-330*EP2)*a1**6/720))];
}
function fromTM(E,N){
  const M=(N-FN)/K0, e1=(1-Math.sqrt(1-E2))/(1+Math.sqrt(1-E2));
  const mu=M/(A*(1-E2/4-3*E2*E2/64-5*E2*E2*E2/256));
  const p1=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)
            +(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu)
            +(151*e1**3/96)*Math.sin(6*mu)+(1097*e1**4/512)*Math.sin(8*mu);
  const s=Math.sin(p1), c=Math.cos(p1), t=Math.tan(p1);
  const C1=EP2*c*c, T1=t*t, Nn=A/Math.sqrt(1-E2*s*s), R1=A*(1-E2)/Math.pow(1-E2*s*s,1.5);
  const Dd=(E-FE)/(Nn*K0);
  const lat=p1-(Nn*t/R1)*(Dd*Dd/2-(5+3*T1+10*C1-4*C1*C1-9*EP2)*Dd**4/24
        +(61+90*T1+298*C1+45*T1*T1-252*EP2-3*C1*C1)*Dd**6/720);
  const lon=LON0+(Dd-(1+2*T1+C1)*Dd**3/6
        +(5-2*C1+28*T1-3*C1*C1+8*EP2+24*T1*T1)*Dd**5/120)/c;
  return [lon*180/Math.PI, lat*180/Math.PI];
}
const toPx = (lon,lat)=>{const [e,n]=toTM(lon,lat); return [(e-AFF.minx)*AFF.k,(AFF.maxy-n)*AFF.k];};

  const s=fitS(), now=performance.now(), dt=Math.max(1,now-lastT);
  const ntx=drag.tx+dx/s, nty=drag.ty+dy/s;
  vx=(ntx-tx)/dt; vy=(nty-ty)/dt; lastT=now;
  tx=ntx; ty=nty;
  if(!raf) raf=requestAnimationFrame(()=>{raf=0;apply();});
});
function endPtr(type,e2){
  ptrs.delete(e2.pointerId);
  if(ptrs.size<2) pinch=null;
  if(ptrs.size) return;
  const wasDrag=!!drag;
  drag=null; svg.classList.remove('drag');
  if(type==='pointerup'&&!moved){
    const hit=hitAt(e2.clientX,e2.clientY);
    const now=performance.now();
    const near=Math.hypot(e2.clientX-lastTapXY[0],e2.clientY-lastTapXY[1])<26;
    if(hit&&hit.__act){ hit.__act(); if(hit.blur) hit.blur(); }
    else if(now-lastTap<330 && near){
      const p=localFromScreen(e2.clientX,e2.clientY); zoomAtSmooth(2,p[0],p[1]); lastTap=0;
    }else{
      lastTap=now; lastTapXY=[e2.clientX,e2.clientY];
      if(sel||selReg) clearSel();
      else if(phone()&&sheetDetent!=='peek') setDetent('peek');
    }
  }else if(wasDrag&&moved&&!reduced()){
    const s0=Math.hypot(vx,vy);
    if(s0>0.02){
      let ax=vx*16, ay=vy*16, t0=performance.now();
      (function step(){
        ax*=0.93; ay*=0.93; tx+=ax; ty+=ay; apply();
        if(Math.hypot(ax,ay)>0.06 && performance.now()-t0<1400) inertia=requestAnimationFrame(step);
        else {inertia=0;paint();}
      })();
    }
  }
  downT=null; moved=false;
  if(!inertia) paint();
}

function nearestDetent(y,v){

  const biased=y+v*160;

  cands.forEach(c=>{const d=Math.abs(biased-c[1]); if(d<bd){bd=d;best=c;}});

}

  if(e.carries) f.push(['Carries',esc(e.carries)]);
  if(e.typ)     f.push(['Structure',esc(e.typ)]);
  if(e.material)f.push(['Material',esc(e.material)]);
  if(e.designer)f.push(['Designer',esc(e.designer)]);
  if(e.engineer)f.push(['Engineer',esc(e.engineer)]);
  if(e.operator)f.push(['Operator',esc(e.operator)]);

function renderList(){
  const vis=visible();
  head('Browse', vis.length+(vis.length===1?' entry':' entries'));
  const cmp={
    name:(a,b)=>a.n.localeCompare(b.n),
    year:(a,b)=>((+b.built||0)-(+a.built||0))||a.n.localeCompare(b.n),
    region:(a,b)=>{const ra=(D.regions.find(r=>r.id===a.reg)||{}).na||'',
                         rb=(D.regions.find(r=>r.id===b.reg)||{}).na||'';
                   return ra.localeCompare(rb)||a.n.localeCompare(b.n);}
  }[sortBy]||((a,b)=>a.n.localeCompare(b.n));
  let out=`<p class="eyebrow">Register</p>
    <h1 class="lt sm">${vis.length} ${vis.length===1?'entry':'entries'}</h1>
    ${filterBar()}
    <div class="seg" role="tablist" aria-label="Evidence">
      ${[['all','All'],['doc','Documented'],['inst','Sites']].map(([k,l])=>
        `<button role="tab" data-ev="${k}" aria-selected="${ev===k}">${l}</button>`).join('')}
    </div>
    <div class="seg" role="tablist" aria-label="Sort">
      ${[['name','A to Z'],['year','Newest'],['region','By region']].map(([k,l])=>
        `<button role="tab" data-sort="${k}" aria-selected="${sortBy===k}">${l}</button>`).join('')}
    </div>`;
  if(ev!=='all') out+=`<p class="note" style="margin-top:10px">${esc(CLSDESC[ev])}</p>`;
  if(sortBy==='region'){
    D.regions.forEach(r=>{
      const g=vis.filter(e=>e.reg===r.id).sort(cmp); if(!g.length) return;
      out+=`<div class="sec">${esc(r.na)}, ${g.length}</div><div class="grp">${g.map(rowHTML).join('')}</div>`;
    });
  }else{
    const byMap=DOMKEYS.slice().sort((a,b)=>mapCount(b)-mapCount(a));
    byMap.forEach(k=>{
      const g=vis.filter(e=>e.dom===k).sort(cmp); if(!g.length) return;
      out+=`<div class="sec">${esc(domName(k))}, ${g.length}</div><div class="grp">${g.map(rowHTML).join('')}</div>`;
    });
  }
  if(!vis.length) out+=`<div class="callout"><p>Nothing matches. Clear the search field, or set the sector chip above the map back to All.</p></div>`;
  $('pane').innerHTML=out; wire();
  $('pane').querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{sortBy=b.dataset.sort;renderList();});
  $('pane').querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>{ev=b.dataset.ev;paint();renderList();});
}

function regionBox(r){
  const nums=r.d.match(/-?\d+(\.\d+)?/g); if(!nums) return null;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(let i=0;i+1<nums.length;i+=2){
    const x=+nums[i],y=+nums[i+1];
    if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
  }
  return [x0,y0,x1,y1];
}

function renderSources(){
  head('Sources','Every reference used');
  const used={};
  entries.forEach(e=>(e.src||[]).forEach(k=>{(used[k]=used[k]||[]).push(e.n);}));
  PROJ.forEach(p=>(p.src||[]).forEach(k=>{(used[k]=used[k]||[]).push(p.ac);}));
  const ORD={journal:0,art:0,conference:1,conf:1,report:2,rep:2,reg:3,db:4,enc:5,
             inst:6,web:7,news:8,data:9};
  const keys=Object.keys(SRC).sort((a,b)=>{
    const ord=ORD;
    return (ord[SRC[a].k]-ord[SRC[b].k])||((SRC[b].y||0)-(SRC[a].y||0))
        || String(SRC[a].t).localeCompare(String(SRC[b].t));
  });
  let out=`<p class="eyebrow">Bibliography</p><h1 class="lt sm">${keys.length} sources</h1>
    <p class="lede">Every factual claim on an entry or project page traces to one of these.
      Peer reviewed work comes first, then official records and registers, then web pages.</p>`;
  const KINDS=[...new Set(Object.keys(SRC).map(k=>SRC[k].k||'web'))]
    .sort((a,b)=>(ORD[a]??99)-(ORD[b]??99)||String(a).localeCompare(String(b)));
  KINDS.forEach(kind=>{
    const g=keys.filter(k=>(SRC[k].k||'web')===kind); if(!g.length) return;
    out+=`<div class="sec">${esc(KIND[kind]||'Other source')}, ${g.length}</div>
      <div class="grp">${g.map(k=>{
        const on=used[k]||[];
        return `<div class="cite">${fmtCite(k)}
          ${on.length?`<div class="citedby">Cited by ${on.map(esc).join(', ')}</div>`:''}
          <span class="acts">${SRC[k].u?`<a href="${esc(SRC[k].u)}" target="_blank" rel="noopener">Open source</a>`:''}
          <button data-cite="${esc(k)}">Copy reference</button></span></div>`;
      }).join('')}</div>`;
  });
  out+=`<p class="note">Links open in a new tab. Copy reference puts a plain text citation on the clipboard.</p>`;
  $('pane').innerHTML=out; wire();
}
