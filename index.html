    <div class="callout"><p class="body">The map is drawn in <span class="mono">EPSG:3035</span>,
      ETRS89 Lambert azimuthal equal area, which is the standard grid for maps of Europe and keeps
      area true across the continent. One map unit is <span class="mono">${MPU} m</span>.</p>
      <p class="body">The Slovenian geometry was first built in <span class="mono">EPSG:3794</span>,
      D96/TM, the national grid, and checked against the official area of the country. It was carried
      into the European grid through the exact inverse of that projection, so the shapes are unchanged. Every entry page still gives its position in both D96/TM and WGS84.</p></div>

    <div class="sec">Coordinate precision</div>
    <div class="grp">${['surveyed','address','derived','locality','approximate',
                        'settlement','municipality'].map(k=>{
      const n=entries.filter(e=>e.prec===k).length;
      return n?`<div class="fr"><span class="k">${esc(PREC[k])}</span><span class="v mono">${n}</span></div>`:'';
    }).join('')}</div>
    <p class="note">Only entries marked as a published coordinate are survey grade. Everything else is a
      settlement centre, a street address or a point read off a road alignment, and each entry page says which.</p>
    ${(D.unplaced||[]).length?`
    <div class="sec">Documented but not placed, ${D.unplaced.length}</div>
    <div class="grp">${D.unplaced.map(u=>`<div class="fr" style="display:block">
      <span class="k" style="display:block;color:var(--label);font-weight:600">${esc(u.n)}</span>
      <span class="v" style="display:block;text-align:left;margin-top:3px;font-size:13.5px;color:var(--label2)">${esc(u.why)}</span>
    </div>`).join('')}</div>
    <p class="note">ZAG names these in the same reference lists as everything else on the map, so the work
      is documented, but no available source gives their position. They are listed here without a marker.</p>`:''}

    <div class="sec">Where the data comes from</div>
    <div class="grp">
      <div class="fr"><span class="k">Municipalities</span><span class="v">geoBoundaries, OSM detail</span></div>
      <div class="fr"><span class="k">Regions</span><span class="v">Eurostat NUTS 3</span></div>
      <div class="fr"><span class="k">Roads, rail, rivers</span><span class="v">Natural Earth 1:10M</span></div>
      <div class="fr"><span class="k">Named peaks</span><span class="v">Natural Earth elevation points</span></div>
      <div class="fr"><span class="k">Town and city names</span><span class="v">GeoNames cities500, ranked by population</span></div>
      <div class="fr"><span class="k">European countries</span><span class="v">Eurostat Nuts2json, NUTS level 0, 39 countries</span></div>
      <div class="fr"><span class="k">The four it omits</span><span class="v">geoBoundaries ADM0 for the United Kingdom, Belarus, Georgia and Moldova</span></div>
      <div class="fr"><span class="k">National projects</span><span class="v">The ZAG national projects register, 139 rows, 133 distinct projects</span></div>
      <div class="fr"><span class="k">Structures</span><span class="v">Peer reviewed papers, ZAG bulletins and annual reports</span></div>
      <div class="fr"><span class="k">Projects</span><span class="v">ZAG national and international project registers, SICRIS and CORDIS</span></div>
      <div class="fr"><span class="k">Research groups</span><span class="v">SICRIS organisation record 743</span></div>
    </div>

    <div class="sec">Keyboard</div>
    <div class="grp">
      <div class="fr"><span class="k">Pan</span><span class="v"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> <kbd>&uarr;</kbd> <kbd>&darr;</kbd></span></div>
      <div class="fr"><span class="k">Zoom</span><span class="v"><kbd>+</kbd> <kbd>&minus;</kbd></span></div>
      <div class="fr"><span class="k">Clear selection</span><span class="v"><kbd>Esc</kbd></span></div>
      <div class="fr"><span class="k">Move through markers</span><span class="v"><kbd>Tab</kbd></span></div>
    </div>

    <div class="sec">How complete the project list is</div>
    <div class="callout"><p class="body">SICRIS records <span class="mono">${D.meta.aris_total}</span>
      ARIS projects for ZAG and <span class="mono">${D.meta.researchers}</span> researchers across
      ${GROUPS.length} research groups. The <span class="mono">${PROJ.length}</span> projects listed
      here come from the ZAG national and international project registers, SICRIS and CORDIS. Where
      the register gives no funder or contact person, the project page says so. Projects with no
      named structure are linked to the ZAG institute marker in Ljubljana.</p></div>

    <div class="sec">Place names</div>
    <div class="callout"><p class="body">Every Slovenian town and village label comes from GeoNames
      cities500, which carries a population for each settlement of 500 people or more. Labels appear in
      population order and are collision tested, so the largest places are drawn first and nothing
      overlaps. All of them fall inside the Slovenian boundary.
      The neighbouring cities in italics come from Natural Earth and are shown for orientation.</p></div>

    <div class="sec">Known gaps</div>
    <ul class="plain">
      <li>The map does not include photographs of the structures.</li>
      <li>The map does not include terrain shading. At this scale the Natural Earth landform polygons
        place Triglav in the lowland and Ljubljana inside the Dinaric Alps, so they are not used.
        Triglav is marked from its own coordinate in Natural Earth, which is correct.</li>
      <li>Municipality boundaries are shown without names, because the source dataset stores the
        Slovenian characters incorrectly.</li>
      <li>ZAG publishes no named project list for its commercial testing work, and its annual reports
        describe that work by category rather than by structure.</li>
      <li>Some online summaries attribute structures to ZAG that primary records do not support. The Puch
        Bridge at Ptuj is one example: the Engineering Chamber of Slovenia record names the designer, the
        supervisor and the contractor, and ZAG is not among them. Structures without a source linking
        them to ZAG are not included.</li>
      <li>Two papers give different dimensions for the Ravbarkomanda viaduct, and both are shown.</li>
    </ul>

    <div class="sec">Everything cited</div>
    <div class="grp"><button class="row" data-view="sources"><b>All ${Object.keys(SRC).length} sources</b>${CHEV}</button></div>
    <p class="note">Built ${esc(D.meta.built)}. Base data from geoBoundaries, Eurostat Nuts2json,
      Natural Earth and GeoNames. Drawn in EPSG:3035.</p>`;
  wire();
}

function setDom(k){
  dom=k;
  const f=$('filters');
  if(f) [...f.children].forEach(x=>x.setAttribute('aria-pressed',x.dataset.dom===k));
  sel=null; paint();
  announce(visible().length+' entries shown');
}
function clearFilters(){
  dom='all'; query='';
  const inp=$('q'), box=$('searchbox');
  if(inp) inp.value='';
  if(box) box.classList.remove('has');
  const f=$('filters');
  if(f) [...f.children].forEach(x=>x.setAttribute('aria-pressed',x.dataset.dom==='all'));
  sel=null; paint();
}
function filterBar(){
  const bits=[];
  if(dom!=='all') bits.push('Sector: '+esc(domName(dom)));
  if(query.trim()) bits.push('Matching \u201c'+esc(query.trim())+'\u201d');
  if(!bits.length) return '';
  return `<div class="fbar"><span>${bits.join(' \u00b7 ')}</span>
    <button data-clearf="1">Clear</button></div>`;
}
function buildChips(){
  const f=$('filters');
  f.textContent='';
  const add=(k,label)=>{
    const b=document.createElement('button');
    b.className='chip'; b.setAttribute('aria-pressed',k===dom); b.dataset.dom=k;
    b.innerHTML=(k==='all'?'':`<i style="background:var(--d-${k})"></i>`)+esc(label)+' <u></u>';
    if(k!=='all') b.dataset.np=projCount(k);
    b.title = k==='all' ? 'Show every sector'
      : `${projCount(k)} projects, ${mapCount(k)} on the map. ${(DOMS[k]||{}).d||''}`;
    b.onclick=()=>{
      setDom(k);
      const cur=stack[stack.length-1];
      if(k!=='all'&&mapCount(k)===0) go({t:'projects'},true);
      else if(cur.t==='list'||cur.t==='projects') enter(cur,true);
    };
    f.appendChild(b);
  };
  add('all','All');
  const SHORT={bridge:'Bridges',ai:'AI & data',energy:'Hydropower',geo:'Geotechnics',
               fire:'Fire safety',mat:'Materials',inst:'Institutions',
               build:'Buildings',herit:'Heritage',
               tunnel:'Tunnels',cable:'Cableways',quake:'Earthquakes'};
  DOMKEYS.filter(k=>mapCount(k)>0).forEach(k=>add(k,SHORT[k]||domName(k)));
}
buildChips();
$('layersbtn').onclick=()=>go({t:'layers'});
{
  const box=$('searchbox'), inp=$('q');
  let t0;
  inp.addEventListener('input',()=>{
    query=inp.value; box.classList.toggle('has',!!query);
    clearTimeout(t0);
    t0=setTimeout(()=>{
      paint();
      const cur=stack[stack.length-1];
      if(cur.t==='projects') enter(cur,true);
      else if(query) go({t:'list'},true);
      else if(cur.t==='list') enter(cur,true);
    },140);
  });
  $('qclr').onclick=()=>{inp.value='';query='';box.classList.remove('has');paint();go({t:'home'},true);inp.focus();};
}

{
  const t=$('tabs');
  TABS.forEach(([k,label])=>{
    const b=document.createElement('button');
    b.setAttribute('role','tab'); b.dataset.tab=k;
    b.setAttribute('aria-selected', k==='detail'); b.textContent=label;
    b.onclick=()=>{
      if(k==='detail'&&sel) go({t:'entry',id:sel},true);
      else go(TABROOT[k],true);
    };
    t.appendChild(b);
  });
}
(function(){
  const tip=$('tip'), wrap=$('mapwrap');
  if(!tip||!wrap) return;
  let raf2=0;
  function show(txt,cx,cy){
    const r=wrap.getBoundingClientRect();
    tip.textContent=txt;
    tip.style.left=(cx-r.left)+'px'; tip.style.top=(cy-r.top)+'px';
    tip.classList.add('on');
  }
  svg.addEventListener('pointermove',e2=>{
    if(phone()||drag||pinch){tip.classList.remove('on');return;}
    cancelAnimationFrame(raf2);
    raf2=requestAnimationFrame(()=>{
      const t0=hitAt(e2.clientX,e2.clientY);
      if(!t0){tip.classList.remove('on');svg.style.cursor='';return;}
      const mk=t0.closest('.mk'), rv=t0.closest('.rivhit'), rg=t0.closest('.regfill');
      if(mk){ const e=entries.find(x=>x.id===mk.dataset.id);
        if(e) show(e.n+', '+domName(e.dom),e2.clientX,e2.clientY); }
      else if(rv){ show(rv.getAttribute('aria-label'),e2.clientX,e2.clientY); }
      else if(rg){ show(rg.getAttribute('aria-label'),e2.clientX,e2.clientY); }
      else tip.classList.remove('on');
      svg.style.cursor=(mk||rv||rg)?'pointer':'';
    });
  });
  svg.addEventListener('pointerleave',()=>{tip.classList.remove('on');svg.style.cursor='';});
  svg.addEventListener('pointerdown',()=>tip.classList.remove('on'));
})();

try{ const t=localStorage.getItem('zag-theme');
  if(t&&t!=='auto') document.documentElement.setAttribute('data-theme',t); }catch(_){}
drawMarkers();
paintMapLegend();
setDetent(phone()?'mid':'full',false);
measureSheet();
snapHome();
paint();
enter(stack[0],true);
requestAnimationFrame(()=>{measureSheet();snapHome();paint();});
(function(){
  const h=decodeURIComponent(location.hash.replace('#',''));
  if(h && entries.some(e=>e.id===h)) setTimeout(()=>go({t:'entry',id:h}),80);
})();

</script>
