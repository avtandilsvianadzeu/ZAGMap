<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZAG Live Map</title>
<meta name="description" content="Live 3D map of Slovenia with the sites, buildings and research projects of ZAG, the Slovenian National Building and Civil Engineering Institute.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme:dark)">
<link rel="icon" href="img/logo.webp">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
/* Layout: full-bleed live map (MapLibre GL, vector tiles, terrain, 3D buildings) under floating iOS materials.
   Tour = the Open Day story sequence with camera flights; Explore = every documented site + address search. */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,system-ui,sans-serif;
  --font-r:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --blue:#007AFF; --zag:#2F5597; --green:#34C759; --orange:#FF9500; --red:#FF3B30;
  --bg:#F2F2F7; --card:#FFFFFF; --label:#1C1C1E; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.32);
  --sep:rgba(60,60,67,.14); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.20);
  --mat:rgba(250,250,252,.74); --mat-thick:rgba(252,252,253,.88); --mat-edge:rgba(255,255,255,.65);
  --pill:rgba(255,255,255,.95); --pill-fg:#1C1C1E;
  --sh1:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.12);
  --sh2:0 2px 6px rgba(0,0,0,.08),0 22px 60px rgba(0,0,0,.20);
  --mapbg:#F6F4EF;
  --d-bridge:#0A84FF; --d-ai:#7D5BE6; --d-build:#D98A13; --d-mat:#22A55C; --d-fire:#F0483B;
  --d-geo:#A0703C; --d-energy:#13A4BA; --d-herit:#D63F9B; --d-inst:#6E7687;
  --d-tunnel:#5E5CE6; --d-cable:#14A3A3; --d-quake:#C9602F;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --blue:#0A84FF; --zag:#7FA6E8;
  --bg:#000000; --card:#1C1C1E; --label:#F5F5F7; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.30);
  --sep:rgba(84,84,88,.55); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.34);
  --mat:rgba(30,30,32,.72); --mat-thick:rgba(28,28,30,.88); --mat-edge:rgba(255,255,255,.10);
  --pill:rgba(44,44,46,.95); --pill-fg:#F5F5F7;
  --sh1:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.5);
  --sh2:0 2px 6px rgba(0,0,0,.5),0 22px 60px rgba(0,0,0,.6);
  --mapbg:#1E1F22; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --blue:#0A84FF; --zag:#7FA6E8;
  --bg:#000000; --card:#1C1C1E; --label:#F5F5F7; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.30);
  --sep:rgba(84,84,88,.55); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.34);
  --mat:rgba(30,30,32,.72); --mat-thick:rgba(28,28,30,.88); --mat-edge:rgba(255,255,255,.10);
  --pill:rgba(44,44,46,.95); --pill-fg:#F5F5F7;
  --sh1:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.5);
  --sh2:0 2px 6px rgba(0,0,0,.5),0 22px 60px rgba(0,0,0,.6);
  --mapbg:#1E1F22; color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--label);font:400 15px/1.4 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;overflow:hidden;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{border:0;background:none;padding:0;margin:0;cursor:pointer}
:focus{outline:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 60%,transparent);outline-offset:2px;border-radius:10px}
a{color:var(--blue);text-decoration:none}
.glass{background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);box-shadow:var(--sh1),inset 0 0 0 .5px var(--mat-edge)}

#app{position:fixed;inset:0;overflow:hidden}
#map{position:absolute;inset:0;background:var(--mapbg)}
.maplibregl-ctrl-attrib{font:11px/1.4 var(--font)!important}
.maplibregl-ctrl-bottom-right{z-index:5}
.maplibregl-ctrl-attrib.maplibregl-compact{background:var(--mat)!important;color:var(--label)}
.maplibregl-ctrl-attrib a{color:var(--label2)!important}

/* selected pin (iOS balloon) */
.selpin{position:relative;width:40px;height:49px;pointer-events:none}
.selpin .bal{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--pc,var(--blue));
  box-shadow:0 0 0 2.5px #fff,0 6px 16px rgba(0,0,0,.35);display:grid;place-items:center;animation:drop .5s cubic-bezier(.3,1.6,.5,1)}
.selpin .bal svg{width:22px;height:22px;transform:rotate(45deg)}
.selpin .lbl{position:absolute;top:58px;left:50%;transform:translateX(-50%);background:var(--pill);color:var(--pill-fg);font:650 13px/1 var(--font);padding:7px 12px;border-radius:99px;
  box-shadow:0 1px 3px rgba(0,0,0,.14),0 6px 16px rgba(0,0,0,.14);white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.selpin .dot{position:absolute;left:50%;top:49px;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--pc,var(--blue));box-shadow:0 0 0 2px #fff}
.selpin .dot::after{content:"";position:absolute;inset:-10px;border-radius:50%;background:var(--pc,var(--blue));opacity:.3;animation:halo 2s ease-out infinite}
@keyframes halo{0%{transform:scale(.4);opacity:.45}100%{transform:scale(2.4);opacity:0}}
@keyframes drop{0%{transform:rotate(-45deg) translate(14px,-14px) scale(.6);opacity:0}100%{transform:rotate(-45deg);opacity:1}}

/* top bar */
.top{position:absolute;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:7px 14px 7px 8px;border-radius:16px}
.brand img{height:30px;width:auto;border-radius:6px;display:block;background:#fff;padding:2px 4px}
.brand b{display:block;font:650 14px/1.15 var(--font);letter-spacing:-.02em}
.brand s{display:block;text-decoration:none;font-size:12px;color:var(--label2)}
.live{display:inline-flex;align-items:center;gap:5px;font:700 10px/1 var(--font);letter-spacing:.06em;color:var(--green);margin-left:6px;vertical-align:1px}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.spacer{flex:1}
.seg{display:flex;padding:3px;border-radius:13px;gap:2px}
.seg button{min-width:72px;height:32px;padding:0 13px;border-radius:10px;font:600 13.5px/1 var(--font);color:var(--label);transition:background .2s,box-shadow .2s;
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button svg{width:16px;height:16px}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04)}
.seg.flat{background:var(--fill);padding:2px;border-radius:11px}
.rbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--label);font:700 12.5px/1 var(--font-r)}
.rbtn svg{width:18px;height:18px}
.rbtn[aria-pressed="true"]{color:var(--blue)}
.stylebar{display:flex;gap:8px;align-items:center}

/* right column */
.zoomstack{position:absolute;right:16px;top:calc(72px + env(safe-area-inset-top,0px));z-index:20;display:flex;flex-direction:column;border-radius:12px;overflow:hidden}
.zoomstack button{width:44px;height:44px;display:grid;place-items:center;color:var(--label)}
.zoomstack button+button{box-shadow:inset 0 .5px 0 var(--sep)}
.zoomstack svg{width:18px;height:18px}
#compass svg{transition:transform .1s linear}

/* tour */
.ends{position:absolute;left:0;right:0;top:calc(76px + env(safe-area-inset-top,0px));z-index:12;display:flex;justify-content:space-between;padding:0 22px;pointer-events:none;transition:opacity .4s}
.ends div{font:300 40px/1 var(--font);color:var(--zag);letter-spacing:-.03em;text-shadow:0 0 12px var(--bg),0 0 3px var(--bg)}
.ends div span{display:block;font:500 13px/1.3 var(--font);color:var(--label);letter-spacing:0;margin-top:3px}
.ends div span em{font-style:normal;color:var(--label2)}
.ends div:last-child{text-align:right;margin-right:56px}
.rail{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:12px;overflow-x:auto;padding:6px 16px 10px;
  scroll-snap-type:x mandatory;scrollbar-width:none;transition:transform .5s cubic-bezier(.3,.8,.2,1),opacity .4s}
.rail::-webkit-scrollbar{display:none}
.rail.away{transform:translateY(140%);opacity:0;pointer-events:none}
.tile{flex:0 0 auto;width:176px;height:118px;border-radius:16px;position:relative;overflow:hidden;scroll-snap-align:start;box-shadow:var(--sh1);background:#888;transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.tile:hover{transform:translateY(-3px)}
.tile:active{transform:scale(.97)}
.tile img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.66))}
.tile .em{position:absolute;right:8px;top:8px;width:26px;height:26px;z-index:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.tile .tx{position:absolute;left:10px;right:10px;bottom:8px;z-index:1;color:#fff;text-align:left}
.tile .tx b{display:block;font:700 15px/1.1 var(--font-r);font-variant-numeric:tabular-nums}
.tile .tx span{display:block;font:600 12px/1.2 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tx em{display:block;font:400 11px/1.2 var(--font);opacity:.8;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.story{position:absolute;z-index:25;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-height:calc(100% - 96px - env(safe-area-inset-top,0px));
  width:min(430px,calc(100% - 32px));border-radius:28px;padding:14px;display:flex;flex-direction:column;
  background:var(--mat-thick);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);
  box-shadow:var(--sh2),inset 0 0 0 .5px var(--mat-edge);transition:transform .55s cubic-bezier(.3,.8,.2,1),opacity .35s;overflow:hidden}
.story.away{transform:translateX(calc(-100% - 40px));opacity:0;pointer-events:none}
.story .shot{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:16/10;flex:0 0 auto;background:var(--fill)}
.story .shot img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .45s}
.story .ems{position:absolute;right:10px;top:10px;display:flex;gap:4px;padding:5px 7px;border-radius:14px;background:rgba(255,255,255,.74);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.story .ems img{width:26px;height:26px;display:block}
.story .credit{position:absolute;left:10px;bottom:8px;font-size:10.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.story .body{padding:16px 8px 4px;flex:0 1 auto;min-height:0;overflow:auto}
.story .head{display:flex;align-items:center;gap:16px}
.story .yr{font:300 48px/1 var(--font);color:var(--zag);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.story .nm b{display:block;font:600 19px/1.2 var(--font);letter-spacing:-.02em;text-wrap:balance}
.story .nm span{display:block;font:400 17px/1.25 var(--font);color:var(--label2);text-wrap:balance}
.story hr{border:0;height:.5px;background:var(--sep);margin:14px 0}
.story .dt b{display:block;font:500 15px/1.4 var(--font)}
.story .dt span{display:block;font:400 14.5px/1.4 var(--font);color:var(--label2);margin-top:2px}
.meta{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 10px;border-radius:99px;background:var(--fill);font:600 12px/1.2 var(--font);color:var(--label)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--blue));flex:0 0 auto}
.chip.ok{background:color-mix(in srgb,var(--green) 20%,transparent)}
.chip.warn{background:color-mix(in srgb,var(--orange) 22%,transparent)}
.chip.busy{opacity:.7}
.story .foot{display:flex;align-items:center;gap:8px;padding:12px 4px 2px;border-top:.5px solid var(--sep);margin-top:10px}
.round{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--blue)}
.round svg{width:18px;height:18px}
.story .foot .round{background:var(--fill);color:var(--label)}
.story .foot .count{flex:1;text-align:center;font:600 13px/1 var(--font);color:var(--label2);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:99px;background:var(--blue);color:#fff;font:600 14px/1 var(--font);white-space:nowrap}
.btn.gray{background:var(--fill);color:var(--blue)}
.btn:active{opacity:.8}
.x{position:absolute;left:10px;top:10px;z-index:3;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.42);color:#fff;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.x svg{width:12px;height:12px}

.dial{position:absolute;right:20px;bottom:calc(40px + env(safe-area-inset-bottom,0px));z-index:22;width:120px;height:120px;border-radius:50%;transition:transform .5s cubic-bezier(.3,.8,.2,1),opacity .35s}
.dial.away{transform:scale(.6) translateY(60px);opacity:0;pointer-events:none}
.dial .d{position:absolute;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:var(--label3);transition:all .35s}
.dial .d.past{background:color-mix(in srgb,var(--blue) 55%,transparent)}
.dial .d.on{width:13px;height:13px;margin:-6.5px;background:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 25%,transparent)}
.dial .yr{position:absolute;inset:0;display:grid;place-items:center;font:600 17px/1 var(--font-r);font-variant-numeric:tabular-nums;pointer-events:none}
.dial .yr small{display:block;font:500 10px/1 var(--font);color:var(--label2);margin-top:3px;text-align:center}
.dial svg.prog{position:absolute;inset:0;pointer-events:none}
.play{position:absolute;right:152px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:22;transition:opacity .35s}
.play.away{opacity:0;pointer-events:none}
.play .round{width:44px;height:44px}
.play svg{width:16px;height:16px}

/* explore panel */
.panel{position:absolute;z-index:25;left:16px;top:calc(70px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100% - 32px));
  border-radius:24px;display:flex;flex-direction:column;overflow:hidden;background:var(--mat-thick);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);
  box-shadow:var(--sh2),inset 0 0 0 .5px var(--mat-edge);transition:transform .5s cubic-bezier(.3,.8,.2,1),opacity .3s}
.panel.away{transform:translateX(calc(-100% - 40px));opacity:0;pointer-events:none}
.grab{display:none}
.ph-top{padding:14px 14px 8px;display:flex;flex-direction:column;gap:10px;flex:0 0 auto}
.search{display:flex;align-items:center;gap:7px;height:38px;padding:0 10px;border-radius:12px;background:var(--fill)}
.search svg{width:15px;height:15px;color:var(--label2);flex:0 0 auto}
.search input{flex:1;min-width:0;border:0;background:none;font-size:16px;outline:none;height:100%}
.search input::placeholder{color:var(--label2)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:99px;background:var(--fill);font:600 13px/1 var(--font);white-space:nowrap}
.fchip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.fchip u{text-decoration:none;color:var(--label2);font-weight:500;font-variant-numeric:tabular-nums}
.fchip[aria-pressed="true"]{background:var(--blue);color:#fff}
.fchip[aria-pressed="true"] u{color:rgba(255,255,255,.75)}
.fchip[aria-pressed="true"] i{box-shadow:0 0 0 1.5px #fff}
.pbody{flex:1;min-height:0;overflow-y:auto;padding:4px 14px 30px;overscroll-behavior:contain}
.navbar{display:flex;align-items:center;gap:6px;padding:4px 0 6px}
.back{display:inline-flex;align-items:center;gap:3px;color:var(--blue);font:500 16px/1 var(--font);height:34px;padding-right:8px}
.back svg{width:11px;height:18px}
.h1{font:700 26px/1.15 var(--font);letter-spacing:-.025em;margin:2px 0 4px;text-wrap:balance}
.sub{color:var(--label2);font-size:15px;margin:0 0 10px}
.secl{font:600 13px/1 var(--font);color:var(--label2);text-transform:uppercase;letter-spacing:.04em;margin:22px 4px 8px}
.list{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:9px 14px;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;left:52px;right:0;top:0;height:.5px;background:var(--sep)}
.row:hover,.row:active{background:var(--fill)}
.ic{width:28px;height:28px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;background:var(--c,var(--blue));color:#fff}
.ic svg{width:16px;height:16px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font:500 15.5px/1.25 var(--font);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t s{display:block;text-decoration:none;font-size:13px;color:var(--label2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.row .v{font-size:14px;color:var(--label2);font-variant-numeric:tabular-nums;flex:0 0 auto}
.chev{width:7px;height:12px;color:var(--label3);flex:0 0 auto}
.kv{display:flex;gap:12px;padding:12px 14px;font-size:15px}
.kv+.kv{box-shadow:inset 0 .5px 0 var(--sep)}
.kv .k{flex:0 0 38%;color:var(--label2)}
.kv .v{flex:1;min-width:0;text-align:right;font-weight:500;overflow-wrap:anywhere}
.para{font-size:15.5px;line-height:1.5;margin:0;max-width:65ch}
.note{font-size:13px;color:var(--label2);line-height:1.45;margin:10px 4px 0}
.callout{background:var(--card);border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.5}
.callout.ev{background:color-mix(in srgb,var(--green) 13%,var(--card))}
.cite{padding:12px 14px;font-size:14px;line-height:1.45}
.cite+.cite{box-shadow:inset 0 .5px 0 var(--sep)}
.cite .kd{display:block;font:700 10.5px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--label2);margin-bottom:5px}
.cite .acts{display:flex;gap:14px;margin-top:6px;font-weight:600;font-size:13.5px}
.hero{border-radius:16px;overflow:hidden;aspect-ratio:16/9;margin:4px 0 12px}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.stat div{background:var(--card);border-radius:14px;padding:12px}
.stat b{display:block;font:700 24px/1 var(--font-r);color:var(--blue);font-variant-numeric:tabular-nums}
.stat s{display:block;text-decoration:none;font-size:12px;color:var(--label2);margin-top:4px}
.acts2{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.spin{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--label3);border-top-color:var(--blue);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* building card */
.bcard{position:absolute;z-index:26;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(380px,calc(100% - 32px));
  border-radius:22px;padding:14px 16px;background:var(--mat-thick);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);
  box-shadow:var(--sh2),inset 0 0 0 .5px var(--mat-edge);transition:transform .4s cubic-bezier(.3,.8,.2,1),opacity .3s}
.bcard.away{transform:translate(-50%,30px);opacity:0;pointer-events:none}

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CHEV='<svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1l5 5.5-5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const BACK='<svg viewBox="0 0 12 20"><path d="M10 1L2 10l8 9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const XI='<svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function toast(m,ms){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),ms||2200);}
const phone=()=>innerWidth<=860;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

const Z=window.ZAG; if(!Z){document.body.textContent='data.js did not load.';return;}
const S=Z.stories, E=Z.entries, P=Z.projects, SRC=Z.src, DOMS=Z.domains;
const EBY=Object.fromEntries(E.map(e=>[e.id,e]));

/* ---------- endpoints (all keyless) ---------- */
const STYLE_URL='https://tiles.openfreemap.org/styles/liberty';
const DEM_URL='https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png';
const SAT_URL='https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
const PHOTON='https://photon.komoot.io';
const SI_BOUNDS=[[13.375,45.421],[16.610,46.876]];

/* ---------- palette ---------- */
const DCOL={bridge:'#0A84FF',ai:'#7D5BE6',build:'#D98A13',mat:'#22A55C',fire:'#F0483B',geo:'#A0703C',energy:'#13A4BA',herit:'#D63F9B',inst:'#6E7687',tunnel:'#5E5CE6',cable:'#14A3A3',quake:'#C9602F'};
const DOMC=k=>`var(--d-${k||'inst'})`;
const PAL={
 light:{land:'#F6F4EF',park:'#CDE6BD',wood:'rgba(150,200,130,.42)',grass:'rgba(180,215,150,.38)',ice:'#F2F7FA',sand:'#F3EAC8',resid:'rgba(233,228,219,.75)',misc:'#E3ECD3',
  water:'#A5D0F3',aero:'#E6E3DD',runway:'#D3D0CA',
  mw:'#FFCB57',mwC:'#E3A53C',tr:'#FFE9A6',trC:'#E2C37E',sec:'#FFFFFF',secC:'#D5CEC1',min:'#FFFFFF',minC:'#DDD8CF',path:'#FFFFFF',rail:'#B5B0A9',
  bld:'#E4DFD7',bldE:'#D5CFC5',bld3:'#EAE6DF',border:'#9C8FB8',border2:'#C3BCCB',
  txt:'#3A3A3C',place:'#1C1C1E',halo:'rgba(255,255,255,.92)',wtxt:'#3D78B5',rtxt:'#6E6A64',
  hsS:'rgba(95,80,60,.42)',hsH:'rgba(255,255,255,.35)',hsA:'rgba(120,100,80,.25)',
  sky:'#A9CBF2',hor:'#E9EFF5',fog:'#F6F4EF'},
 dark:{land:'#1E1F22',park:'#1D3123',wood:'rgba(45,85,55,.45)',grass:'rgba(50,85,55,.35)',ice:'#2B3036',sand:'#3A3627',resid:'rgba(44,45,49,.75)',misc:'#24302A',
  water:'#17293D',aero:'#2A2B2F',runway:'#3A3B40',
  mw:'#8C6B26',mwC:'#5E481A',tr:'#5E5134',trC:'#40372A',sec:'#4A4B50',secC:'#2E2F33',min:'#3B3C41',minC:'#2A2B2F',path:'#4A4B50',rail:'#5C5C60',
  bld:'#2C2D31',bldE:'#3A3B40',bld3:'#38393E',border:'#8F86A8',border2:'#55505E',
  txt:'#D1D1D6',place:'#F2F2F7',halo:'rgba(20,20,22,.92)',wtxt:'#7FB0E6',rtxt:'#A1A1A6',
  hsS:'rgba(0,0,0,.55)',hsH:'rgba(255,255,255,.07)',hsA:'rgba(0,0,0,.3)',
  sky:'#0B1626',hor:'#1F2835',fog:'#1E1F22'}
};
const SATSKY={sky:'#8FB6E3',hor:'#D9E4EE',fog:'#B9C3C9'};

/* ---------- state ---------- */
let theme=(()=>{const a=document.documentElement.getAttribute('data-theme');return a||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();
let base='map', is3d=true, MODE='tour', storyIdx=-1, tab='sites', query='', dom='all', selId=null;
let map=null, ready=false, ORIG={}, TOUCHED={}, selMarker=null, hlToken=0, orbitOn=false, userMoved=false;
const LAND_FILL=/^(park|landuse_|landcover_|water$|aeroway_fill|building$|road_area_pattern)/;

/* road class from layer id */
function roadClass(id){
  if(/rail/.test(id)) return 'rail';
  if(/path_pedestrian/.test(id)) return 'path';
  if(/motorway/.test(id)) return 'mw';
  if(/trunk_primary/.test(id)) return 'tr';
  if(/(^|_)link/.test(id)) return 'tr';
  if(/secondary_tertiary/.test(id)) return 'sec';
  return 'min';
}
/* the look of every basemap layer for (theme, base). Returns {paint:{}, vis:'visible'|'none'} */
function look(L,T,B){
  const p=PAL[T], id=L.id, o={}, sat=B==='sat'; let vis='visible';
  if(L.type==='background'){o['background-color']=p.land;}
  else if(id==='park'){o['fill-color']=p.park;o['fill-outline-color']=p.park;o['fill-opacity']=.9;}
  else if(id==='park_outline'){o['line-opacity']=0;}
  else if(id==='landuse_residential'){o['fill-color']=p.resid;}
  else if(id==='landcover_wood'){o['fill-color']=p.wood;o['fill-opacity']=1;}
  else if(id==='landcover_grass'){o['fill-color']=p.grass;o['fill-opacity']=1;}
  else if(id==='landcover_ice'){o['fill-color']=p.ice;}
  else if(id==='landcover_sand'){o['fill-color']=p.sand;}
  else if(/^landuse_/.test(id)&&L.type==='fill'){o['fill-color']=p.misc;}
  else if(id==='water'){o['fill-color']=p.water;}
  else if(/^waterway/.test(id)&&L.type==='line'){o['line-color']=p.water;}
  else if(id==='aeroway_fill'){o['fill-color']=p.aero;}
  else if(/^aeroway_/.test(id)){o['line-color']=p.runway;}
  else if(/^(tunnel|road|bridge)_/.test(id)&&L.type==='line'){
    const c=roadClass(id), cas=/_casing$/.test(id);
    if(c==='rail') o['line-color']=p.rail;
    else if(cas) o['line-color']=p[(c==='path'?'min':c)+'C'];
    else o['line-color']=p[c];
    if(/^tunnel_/.test(id)) o['line-opacity']=.55;
    if(sat){
      if(cas||c==='min'||c==='path'||c==='rail') vis='none';
      else o['line-opacity']=c==='mw'?.75:.55;
    }
  }
  else if(id==='building'){o['fill-color']=p.bld;o['fill-outline-color']=p.bldE;}
  else if(id==='building-3d'){o['fill-extrusion-color']=p.bld3;o['fill-extrusion-opacity']=T==='dark'?.92:.88;o['fill-extrusion-vertical-gradient']=true;}
  else if(id==='boundary_2'){o['line-color']=sat?'rgba(255,255,255,.75)':p.border;}
  else if(id==='boundary_3'){o['line-color']=sat?'rgba(255,255,255,.4)':p.border2;}
  else if(id==='hillshade'){o['hillshade-shadow-color']=p.hsS;o['hillshade-highlight-color']=p.hsH;o['hillshade-accent-color']=p.hsA;if(sat)vis='none';}
  else if(id==='sat'){vis=sat?'visible':'none';}
  if(L.type==='symbol'&&L.layout&&L.layout['text-field']&&!/shield/.test(id)){
    const water=/water/.test(id), road=/^highway-name/.test(id), place=/^label_/.test(id);
    if(sat){o['text-color']=water?'#D6EBFF':'#FFFFFF';o['text-halo-color']='rgba(0,0,0,.72)';}
    else{o['text-color']=water?p.wtxt:road?p.rtxt:place?p.place:p.txt;o['text-halo-color']=p.halo;}
    o['text-halo-width']=1.4;
  }
  if(sat&&LAND_FILL.test(id)) vis='none';
  if(id==='building-3d'&&(!is3d||sat)) vis='none';
  return {paint:o,vis};
}

/* prepare the OpenFreeMap style before the map is created (no flash of other colours) */
function prep(s){
  s.layers=s.layers.filter(l=>l.id!=='natural_earth');
  delete s.sources.ne2_shaded;
  s.sources['dem-terrain']={type:'raster-dem',tiles:[DEM_URL],tileSize:256,maxzoom:15,encoding:'terrarium',
    attribution:'<a href="https://github.com/tilezen/joerd/blob/master/docs/attribution.md" target="_blank" rel="noopener">Terrain: Mapzen / AWS Terrain Tiles</a>'};
  s.sources['dem-hill']={type:'raster-dem',tiles:[DEM_URL],tileSize:256,maxzoom:15,encoding:'terrarium'};
  s.sources.sat={type:'raster',tiles:[SAT_URL],tileSize:256,maxzoom:19,
    attribution:'Imagery © <a href="https://www.esri.com" target="_blank" rel="noopener">Esri</a>, Maxar, Earthstar Geographics'};
  const local=['coalesce',['get','name:latin'],['get','name']];
  s.layers.forEach(l=>{ if(l.layout&&l.layout['text-field']&&JSON.stringify(l.layout['text-field']).includes('name_en')) l.layout['text-field']=local; });
  const bi=s.layers.findIndex(l=>l.type==='background');
  s.layers.splice(bi+1,0,{id:'sat',type:'raster',source:'sat',layout:{visibility:'none'},paint:{'raster-fade-duration':200}});
  let wi=s.layers.findIndex(l=>/^waterway/.test(l.id)); if(wi<0) wi=bi+2;
  s.layers.splice(wi,0,{id:'hillshade',type:'hillshade',source:'dem-hill',paint:{'hillshade-exaggeration':.42,'hillshade-illumination-direction':315}});
  // remember original values of every property the looks touch, so switching back restores them
  for(const L of s.layers){
    const keys=new Set();
    for(const T of ['light','dark']) for(const B of ['map','sat']) Object.keys(look(L,T,B).paint).forEach(k=>keys.add(k));
    TOUCHED[L.id]=[...keys]; ORIG[L.id]=Object.fromEntries([...keys].map(k=>[k,(L.paint||{})[k]]));
    const lk=look(L,theme,base); L.paint=Object.assign({},L.paint||{},lk.paint); L.layout=Object.assign({},L.layout||{},{visibility:lk.vis});
  }
  return s;
}
function skyFor(){const p=base==='sat'?SATSKY:PAL[theme];return {'sky-color':p.sky,'horizon-color':p.hor,'fog-color':p.fog,'fog-ground-blend':.55,'horizon-fog-blend':.6,'sky-horizon-blend':.75,'atmosphere-blend':0};}
function applyLook(){
  if(!ready) return;
  for(const L of map.getStyle().layers){
    if(!(L.id in TOUCHED)) continue;
    const lk=look(L,theme,base);
    for(const k of TOUCHED[L.id]){ const v=k in lk.paint?lk.paint[k]:ORIG[L.id][k]; try{map.setPaintProperty(L.id,k,v===undefined?null:v);}catch(_){} }
    map.setLayoutProperty(L.id,'visibility',lk.vis);
  }
  try{map.setSky(skyFor());}catch(_){}
  const dk=theme==='dark'||base==='sat';
  map.setPaintProperty('pt-l','text-color',dk?'#FFFFFF':'#1C1C1E');
  map.setPaintProperty('pt-l','text-halo-color',dk?'rgba(0,0,0,.78)':'rgba(255,255,255,.95)');
  map.setPaintProperty('st-l','text-color',dk?'#FFFFFF':'#1C1C1E');
  map.setPaintProperty('st-l','text-halo-color',dk?'rgba(0,0,0,.78)':'rgba(255,255,255,.95)');
  map.setPaintProperty('hl-ext','fill-extrusion-color',base==='sat'?'#FFD60A':theme==='dark'?'#0A84FF':'#007AFF');
}

/* ---------- theme / style controls ---------- */
function setTheme(t){ theme=t; document.documentElement.setAttribute('data-theme',t); applyLook(); }
$('bTheme').onclick=()=>setTheme(theme==='dark'?'light':'dark');
function setBase(b){ base=b; $('sMap').setAttribute('aria-pressed',b==='map'); $('sSat').setAttribute('aria-pressed',b==='sat'); applyLook(); }
$('sMap').onclick=()=>setBase('map'); $('sSat').onclick=()=>setBase('sat');
function set3d(on){
  is3d=on; $('b3d').setAttribute('aria-pressed',on);
  if(!ready) return;
  map.setTerrain(on?{source:'dem-terrain',exaggeration:1.25}:null);
  applyLook();
  if(!on) map.easeTo({pitch:0,bearing:0,duration:700});
  else if(map.getPitch()<20) map.easeTo({pitch:55,duration:900});
}
$('b3d').onclick=()=>set3d(!is3d);

/* ---------- geometry helpers ---------- */
const R=6371008.8, rad=Math.PI/180;
function meters(a,b){const x=(b[0]-a[0])*rad*Math.cos((a[1]+b[1])/2*rad), y=(b[1]-a[1])*rad; return Math.hypot(x,y)*R;}
function toXY(p,o){return [(p[0]-o[0])*rad*Math.cos(o[1]*rad)*R,(p[1]-o[1])*rad*R];}
function inRing(pt,ring){let c=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const a=ring[i],b=ring[j];
  if(((a[1]>pt[1])!==(b[1]>pt[1]))&&(pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0])) c=!c;}return c;}
function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy);}
function polys(g){return g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];}
/* distance in metres from a point to a building footprint, 0 when inside */
function distTo(lngLat,g){
  let best=Infinity;
  for(const poly of polys(g)){
    const rings=poly.map(r=>r.map(c=>toXY(c,lngLat)));
    if(inRing([0,0],rings[0])&&!rings.slice(1).some(h=>inRing([0,0],h))) return 0;
    for(const r of rings) for(let i=1;i<r.length;i++) best=Math.min(best,segDist([0,0],r[i-1],r[i]));
  }
  return best;
}
function centroid(g){let sx=0,sy=0,n=0;for(const poly of polys(g)) for(const c of poly[0]){sx+=c[0];sy+=c[1];n++;}return n?[sx/n,sy/n]:null;}
function circle(c,m,n){n=n||72;const out=[];for(let i=0;i<=n;i++){const a=i/n*2*Math.PI;out.push([c[0]+m*Math.cos(a)/(R*Math.cos(c[1]*rad))/rad,c[1]+m*Math.sin(a)/R/rad]);}return {type:'Polygon',coordinates:[out]};}

/* ---------- building highlight ----------
   Uses the building footprints of the live vector tiles (OpenStreetMap; in Slovenia these largely come from
   the GURS building cadastre). Picks the footprint that contains the point, else the nearest within maxM. */
const within=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);
/* wait until the tiles in view are in, but never longer than 8 s (a slow far-horizon tile must not block the highlight) */
function waitIdle(){return within(new Promise(res=>{ if(map.loaded()&&map.areTilesLoaded()) setTimeout(res,60); else map.once('idle',()=>res()); }),8000);}
function findBuilding(lngLat,maxM){
  let feats=[]; try{feats=map.querySourceFeatures('openmaptiles',{sourceLayer:'building'});}catch(_){return null;}
  let best=null, bd=Infinity;
  for(const f of feats){
    const c=centroid(f.geometry); if(!c||meters(c,lngLat)>400) continue;
    const d=distTo(lngLat,f.geometry); if(d<bd){bd=d;best=f;}
  }
  if(!best||bd>maxM) return null;
  const parts=best.id!=null?feats.filter(f=>f.id===best.id):[best];
  return {feature:best,parts,dist:bd,id:best.id,h:+(best.properties.render_height||best.properties.height||8),b:+(best.properties.render_min_height||0),c:centroid(best.geometry)};
}
function showBuilding(b){
  const fc={type:'FeatureCollection',features:b?b.parts.map(f=>({type:'Feature',properties:{h:+(f.properties.render_height||8)+0.6,b:+(f.properties.render_min_height||0)},geometry:f.geometry})):[]};
  map.getSource('hl').setData(fc);
  try{ map.setFilter('building-3d', b&&b.id!=null?['!=',['id'],b.id]:null); map.setFilter('building', b&&b.id!=null?['!=',['id'],b.id]:null);}catch(_){}
}
function clearHL(){ hlToken++; if(!ready) return; showBuilding(null); map.getSource('unc').setData({type:'FeatureCollection',features:[]}); }

/* ---------- geocoding (Photon, OpenStreetMap) ---------- */
const GEO={};
function hnOf(addr){const m=/\s(\d+\s*[a-z]?)\s*,/i.exec(addr);return m?m[1].replace(/\s/g,'').toLowerCase():null;}
function geocodeAddress(addr){
  if(GEO[addr]) return GEO[addr];
  const hn=hnOf(addr), street=addr.split(',')[0].replace(/\s\d+\s*[a-z]?$/i,'').trim().toLowerCase();
  const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  GEO[addr]=fetch(`${PHOTON}/api/?q=${encodeURIComponent(addr)}&limit=6&bbox=13.3,45.4,16.7,46.9`).then(r=>r.ok?r.json():null).then(j=>{
    if(!j||!j.features) return null;
    const f=j.features.find(f=>{const p=f.properties||{};return hn&&String(p.housenumber||'').replace(/\s/g,'').toLowerCase()===hn&&norm(p.street||p.name).startsWith(norm(street).slice(0,5));});
    return f?{ll:f.geometry.coordinates,props:f.properties}:null;
  }).catch(()=>null);
  return GEO[addr];
}
function fmtAddr(p){if(!p)return '';const l1=[p.street||p.name,p.housenumber].filter(Boolean).join(' ');const l2=[p.postcode,p.city||p.town||p.village||p.locality].filter(Boolean).join(' ');return [l1,l2].filter(Boolean).join(', ');}

/* ---------- camera ---------- */
const UNC={settlement:900,municipality:2500,locality:500,approximate:800,derived:150};
const PREC={surveyed:'Published coordinate',derived:'Derived from river alignment',locality:'Locality centre, approximate',address:'Street address',
  approximate:'Approximate, from the road alignment',settlement:'Settlement centre, approximate',municipality:'Municipality centre, approximate'};
const PRECOK=p=>p==='surveyed'||p==='address';
function zoomFor(x){
  if(x.prec==='address') return 17.3;
  if(x.prec==='surveyed'){return ({tunnel:15.3,dam:16,bridge:16.2,cable:14.8,slide:14.8,build:17,inst:17,tower:16.5,road:15.5,geo:15}[x.cat])||16.2;}
  if(x.prec==='derived') return 16;
  if(x.prec==='municipality') return 12.6;
  return 14;
}
function bearingFor(id){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))|0;return (Math.abs(h)%70)-35;}
function padNow(){
  if(phone()){
    if(MODE==='explore') return {top:70,bottom:Math.round(innerHeight*0.62),left:20,right:60};
    if(storyIdx>=0) return {top:70,bottom:Math.round(innerHeight*0.56),left:20,right:60};
    return {top:110,bottom:150,left:20,right:20};
  }
  if(MODE==='explore') return {top:80,bottom:40,left:440,right:80};
  if(storyIdx>=0) return {top:80,bottom:40,left:470,right:160};
  return {top:140,bottom:170,left:40,right:80};
}
/* camera move + callback when it ends. Stops any running animation first, so the callback cannot catch the stale
   moveend of the interrupted one, and is registered before the move, so an instant move (reduced motion) still reports. */
function moveThen(kind,opts,cb){ map.stop(); if(cb) map.once('moveend',cb); map[kind](opts); }
function flyToSite(x,cb){
  orbitOn=false; userMoved=false;
  const z=zoomFor(x), pitch=is3d?(z>=15?60:50):0, bearing=is3d?bearingFor(x.id||x.key):0;
  moveThen('flyTo',{center:[x.lon,x.lat],zoom:z,pitch,bearing,padding:padNow(),speed:1.3,curve:1.42,essential:true,maxDuration:reduced?1:9000},cb);
}
function home(fast){
  orbitOn=false; clearHL(); setSel(null);
  const cam=map.cameraForBounds(SI_BOUNDS,{padding:padNow()});
  if(!cam) return;
  moveThen('flyTo',{center:cam.center,zoom:cam.zoom+(is3d?0.15:0),pitch:is3d?38:0,bearing:0,padding:{top:0,bottom:0,left:0,right:0},duration:fast||reduced?0:2200,essential:true});
}
function orbit(tok){
  if(!orbitOn||reduced||!is3d||tok!==hlToken) return;
  moveThen('easeTo',{bearing:map.getBearing()+24,duration:16000,easing:t=>t},()=>{ if(!userMoved) orbit(tok); });
}

  mat:'M0-4.2 4-2v4.4L0 4.4-4 2.4V-2z',build:'M-4.8 4V-1.4L0-4.4l4.8 3V4zM-1.8 4V.4h3.6V4',herit:'M-4.8 4V-1h9.6v5M-3.2-1v-1.6h6.4V-1M0-4.6l3.6 2H-3.6z',
  tunnel:'M-4.6 4.2V0a4.6 4.6 0 0 1 9.2 0v4.2M-1.6 4.2V1.6h3.2v2.6',cable:'M-5-2.6h10M0-2.6v2.4M-2.4 0h4.8v3.4h-4.8z',
  quake:'M-5 0h2l1.4-3.4 2 6.4 1.6-4.2 1 1.2h2',inst:'M-3.6-3.6h7.2v7.2h-7.2z',pin:'M0-4.6a3.4 3.4 0 1 1 0 6.8 3.4 3.4 0 1 1 0-6.8z'};
const ico=k=>`<span class="ic" style="--c:${DOMC(k)}"><svg viewBox="-6 -6 12 12"><path d="${GL[k]||GL.inst}" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
function setSel(o){
  if(selMarker){selMarker.remove();selMarker=null;}
  selId=o&&o.id||null;
  if(ready) map.setFilter('pt',selId?['all',['!',['has','point_count']],['!=',['get','id'],selId]]:['!',['has','point_count']]);
  if(ready) map.setFilter('pt-l',selId?['all',['!',['has','point_count']],['!=',['get','id'],selId]]:['!',['has','point_count']]);
  if(!o) return;
  const el=document.createElement('div'); el.className='selpin'; el.style.setProperty('--pc',o.color||'var(--blue)');
  el.innerHTML=`<div class="bal"><svg viewBox="-6 -6 12 12"><path d="${GL[o.glyph]||GL.pin}" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="dot"></div><div class="lbl">${esc(o.label)}</div>`;
  selMarker=new maplibregl.Marker({element:el,anchor:'bottom',offset:[0,0]}).setLngLat(o.ll).addTo(map);
}
/* x: entry or story-like {lat,lon,prec,cat,addr,id}. onPos(info) reports how the position was resolved */
async function locate(x,onPos){
  const tok=++hlToken;
  showBuilding(null);
  const ll=[x.lon,x.lat];
  const unc=UNC[x.prec];
  map.getSource('unc').setData({type:'FeatureCollection',features:unc?[{type:'Feature',properties:{},geometry:circle(ll,unc)}]:[]});
  const wantBuilding=!!x.addr||(x.prec==='surveyed'&&/^(build|inst)$/.test(x.cat));
  let target=ll, how=null, g=null;
  if(x.addr){ onPos&&onPos({state:'busy',text:'Matching the address…'}); g=await within(geocodeAddress(x.addr),6000); if(tok!==hlToken) return;
    if(g&&meters(g.ll,ll)<1500){target=g.ll;how='address';} }
  if(how==='address'&&meters(target,ll)>25){ await new Promise(r=>moveThen('easeTo',{center:target,duration:reduced?0:900},r)); }
  if(!wantBuilding){ onPos&&onPos({state:'done',kind:unc?'area':'point'}); return; }
  await new Promise(r=>map.isMoving()?map.once('moveend',r):r()); if(tok!==hlToken) return;
  await waitIdle(); if(tok!==hlToken) return;
  const b=findBuilding(target,how==='address'?20:35);
  if(tok!==hlToken) return;
  showBuilding(b);
  onPos&&onPos({state:'done',kind:b?'building':'point',how,dist:g?Math.round(meters(g.ll,ll)):null,b,geo:g});
  // the geocoder answered after the timeout: upgrade to the building at the address once it arrives
  if(x.addr&&!g) geocodeAddress(x.addr).then(g2=>{
    if(!g2||tok!==hlToken||meters(g2.ll,ll)>=1500) return;
    const b2=findBuilding(g2.ll,20); if(!b2) return;
    showBuilding(b2); onPos&&onPos({state:'done',kind:'building',how:'address',dist:Math.round(meters(g2.ll,ll)),b:b2,geo:g2});
  });
}
function posChip(info,x){
  if(!info||info.state==='busy') return `<span class="chip busy"><span class="spin"></span>${esc(info?info.text:'Locating…')}</span>`;
  if(info.kind==='building') return `<span class="chip ok">Building highlighted${info.how==='address'?' from the street address':''}</span>`;
  if(info.kind==='area') return `<span class="chip warn">${esc(PREC[x.prec]||'Approximate')} · shaded area</span>`;
  return `<span class="chip ${PRECOK(x.prec)?'ok':'warn'}">${esc(PREC[x.prec]||x.prec)}</span>`;
}
function posNote(info,x){
  if(!info||info.state==='busy') return '';
  if(info.kind==='building'){
    const h=info.b&&info.b.h?` The footprint is about ${Math.round(info.b.h)} m tall in the map data.`:'';
    return info.how==='address'
      ? `The building is matched from the street address in OpenStreetMap${info.dist!=null?`, ${info.dist} m from the coordinate in the dataset`:''}.${h}`
      : `The building is the footprint at or nearest to the recorded coordinate.${h}`;
  }
  if(x.addr) return 'The address could not be matched live, so the pin stays on the recorded coordinate and no building is claimed.';
  if(info.kind==='area') return 'This position is a settlement or area centre, not the structure itself. The shaded circle marks the area it stands for.';
  return '';
}

function openStory(i){
  if(MODE!=='tour') setMode('tour',true);
  document.body.classList.remove('ov');
  storyIdx=(i+S.length)%S.length; const s=S[storyIdx];
  rail.classList.add('away'); $('ends').style.opacity=0; $('bcard').classList.add('away');
  dial.classList.remove('away'); $('playw').classList.remove('away');
  renderStory(s,null); story.classList.remove('away');
  dial.querySelectorAll('.d').forEach((d,j)=>{d.classList.toggle('on',j===storyIdx);d.classList.toggle('past',j<storyIdx);});
  $('dyr').innerHTML=`<span>${esc(s.year)}<small>${storyIdx+1} / ${S.length}</small></span>`;
  if(!ready) return;
  const e=s.entry?EBY[s.entry]:null;
  const x={id:s.key,lat:s.lat,lon:s.lon,prec:s.prec,cat:e?e.cat:'build',addr:s.addr||(e&&e.addr)};
  setSel({id:e?e.id:null,ll:[s.lon,s.lat],label:s.town||s.en,color:'var(--zag)',glyph:e?e.dom:'build'});
  const idx=storyIdx;
  if(x.addr) geocodeAddress(x.addr); // start the lookup now so it is ready when the flight lands
  flyToSite(x,()=>{ if(storyIdx!==idx) return;
    locate(x,info=>{ if(storyIdx!==idx) return; updStoryPos(info,x);
      if(info.state==='done'&&info.how==='address'&&selMarker) selMarker.setLngLat(info.b&&info.b.c||info.geo.ll);
      if(info.state==='done'){ orbitOn=true; orbit(hlToken); } });
  });

}

      setSel(null);
      { const ep=$('epos'); if(ep) ep.innerHTML='<span class="chip">The highlight now shows the building you picked</span>'; const en=$('enote'); if(en) en.textContent=''; }
      showCard('Building','Looking up the nearest address…',`<span class="chip ok">Building highlighted</span>`,ll);
      fetch(`${PHOTON}/reverse?lon=${ll[0]}&lat=${ll[1]}&limit=1`).then(r=>r.ok?r.json():null).then(j=>{
        if(tok!==hlToken) return; const f=j&&j.features&&j.features[0];
        const c=$('bcard'); if(!f){c.querySelector('s').textContent='No address found nearby';return;}
        const p=f.properties; c.querySelector('b').textContent=p.housenumber?fmtAddr(p):(p.name||fmtAddr(p));
        c.querySelector('s').textContent=`Nearest address in OpenStreetMap, ${Math.round(meters(f.geometry.coordinates,ll))} m from the click`;
      }).catch(()=>{const c=$('bcard');if(tok===hlToken&&c)c.querySelector('s').textContent='Address lookup unavailable';});
    });
    ['dragstart','wheel','touchstart','mousedown'].forEach(t=>map.on(t,ev=>{if(ev.originalEvent){userMoved=true;orbitOn=false;}}));
    // MapLibre 5.x leaves the terrain elevation frozen after a programmatic flyTo/easeTo, so terrain tiles that arrive
    // after the flight never lift the camera. On real hills that leaves the camera under the ground. Release it.
    map.on('moveend',()=>{ if(map.terrain&&map._elevationFreeze===true&&!map.isMoving()){ map._elevationFreeze=false; map.triggerRepaint(); } });
    map.on('rotate',()=>{$('compass').firstChild.style.transform=`rotate(${-map.getBearing()}deg)`;});
    map.on('error',ev=>{ if(ev&&ev.sourceId==='sat'&&base==='sat'&&!boot.satWarned){boot.satWarned=true;toast('Some satellite tiles failed to load.');} });
    // route
    const h=decodeURIComponent(location.hash.slice(1));
    if(h==='kiosk'){home(true);setTimeout(startAuto,1800);}
    else if(h==='explore'){setMode('explore');}
    else{const i=S.findIndex(s=>s.key===h); if(i>=0){home(true);setTimeout(()=>openStory(i),600);} else if(EBY[h]){setMode('explore',true);openEntry(h);} else {home(true);} }
  });
}
$('zin').onclick=()=>map&&map.zoomIn(); $('zout').onclick=()=>map&&map.zoomOut();
$('compass').onclick=()=>map&&map.easeTo({bearing:0,pitch:is3d?map.getPitch():0,duration:600});
$('zhome').onclick=()=>{stopAuto();if(MODE==='tour'&&storyIdx>=0)overview();else if(map)home();};
let rz; addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(map)map.resize();},150);});

buildChips(); showList(); document.body.classList.add('ov'); $('chips').hidden=false;
document.documentElement.setAttribute('data-theme',theme);
boot();
})();
</script>
</body>
