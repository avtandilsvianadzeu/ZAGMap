# Finds one freely licensed Wikimedia Commons photo per record (with author and licence) and commits data/images.json.
name: Find record photos
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node tools/fetch_images.js
      - run: |
          git config user.name "atlas-bot" && git config user.email "atlas-bot@users.noreply.github.com"
          git add data/images.json && git commit -m "Update record photos from Wikimedia Commons" || echo "no change"
          git push
